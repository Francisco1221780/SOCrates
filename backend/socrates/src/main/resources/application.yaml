spring:
  application:
    name: socrates

# Motor Prolog (config/PrologProperties). Os valores abaixo sao os de omissao, menos o timeout (de omissao 10s).
socrates:
  prolog:
    swipl: swipl          # nome no PATH ou caminho do executavel
    # home:               # raiz com motores/prolog/ e base_conhecimento/; sem valor, usa a copia do jar
    timeout: 30s          # a sequencia base inteira com a base v6.1 demora ~9 s num portatil (com a v6, ~8 s)
    max-processos: 4
    espera: 2s            # espera por um lugar livre antes de responder "ocupado"
