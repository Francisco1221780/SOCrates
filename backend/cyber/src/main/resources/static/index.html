<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberRangers · SOC</title>
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CyberRangers · Dashboard SOC
   Renderizador da API: tudo o que aparece vem de GET /api/health,
   GET /api/cenarios e POST /api/{motor}/infer. O UI nao tem cenarios,
   regras, tickets nem explicacoes escritos a mao.
   ===================================================================== */
:root{
  --bg:#0b1017; --panel:#0f1722; --panel2:#131d2b; --panel3:#0a121b;
  --line:#1c2d3d; --line2:#263f54;
  --cyan:#22d3ee; --cyan2:#22d3ee1f; --cyan3:#22d3ee55;
  --indigo:#818cf8; --indigo2:#818cf81f;
  --txt:#e2eef3; --dim:#84a0ae; --dim2:#526d7a;
  --entrada:#22d3ee; --inicial:#94a3b8; --regra:#c084fc; --rulepill:#38bdf8; --cond:#fbbf24;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --sev0:#64748b; --sev1:#facc15; --sev2:#fb923c; --sev3:#f43f5e;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --brand:'Chakra Petch','JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12.5px}
body{overflow:hidden}
button,select,input{font-family:var(--mono);font-size:12px;color:var(--txt)}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--cyan)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1f3344;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.app{position:fixed;inset:0;display:grid;grid-template-rows:54px minmax(0,1fr) auto;}
.app.log-open{grid-template-rows:54px minmax(0,1fr) 180px}

/* ---------- topo ---------- */
header{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,#0f1925,#0b131c);min-width:0}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand img{width:30px;height:30px}
.brand b{font-family:var(--brand);font-size:16px;letter-spacing:.6px}
.brand span{color:var(--dim);font-size:11px}
.hgrow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);background:var(--panel3);font-size:11px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dot.bad{background:var(--bad);box-shadow:0 0 7px var(--bad)}
.dot.wait{background:var(--warn);box-shadow:0 0 7px var(--warn)}
.health{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.eng{display:inline-flex;background:#070d14;border:1px solid var(--line2);border-radius:7px;padding:3px;gap:3px;flex-shrink:0}
.eng button{background:transparent;border:1px solid transparent;color:var(--dim);font-weight:700;padding:5px 11px;border-radius:5px}
.eng button:hover:not(:disabled){color:#fff;background:#ffffff0d}
.eng button.on[data-eng=prolog]{color:#fff;border-color:var(--cyan);background:var(--cyan2);box-shadow:0 0 12px #22d3ee44}
.eng button.on[data-eng=drools]{color:#fff;border-color:var(--indigo);background:var(--indigo2);box-shadow:0 0 12px #818cf844}
.eng button.on[data-eng=both]{color:#fff;border-color:var(--warn);background:#fbbf241a;box-shadow:0 0 12px #fbbf2444}
.icon-btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;color:var(--dim)}
.icon-btn:hover:not(:disabled){color:#fff;border-color:var(--cyan3)}

/* ---------- corpo ---------- */
.body{display:grid;grid-template-columns:300px minmax(0,1fr) 420px;min-height:0}
.side,.detail{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--line2)}
.detail{border-left:1px solid var(--line2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.scroll{overflow:auto;min-height:0}

.runcard{margin:4px 10px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:10px}
.runcard.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan3) inset}
.runcard h3{margin:0 0 4px;font-size:12.5px;display:flex;align-items:center;gap:7px}
.runcard p{margin:0 0 8px;color:var(--dim);font-size:11px;line-height:1.45}
.grp{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.grp input{accent-color:var(--cyan)}
.grp .n{margin-left:auto;color:var(--dim);font-size:11px}
.btn{background:var(--cyan);color:#04131a;border:none;border-radius:6px;padding:7px 12px;font-weight:700}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.btn.ghost:hover:not(:disabled){border-color:var(--cyan3)}
.btn.small{padding:4px 8px;font-size:11px}
.w100{width:100%}

.search{width:calc(100% - 20px);margin:0 10px 8px;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:6px 9px}
.search:focus,.inp:focus{outline:none;border-color:var(--cyan3)}
.scen-grp{padding:6px 12px 3px;font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.8px}
.scen{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:none;border-left:2px solid transparent;padding:6px 12px;color:var(--txt)}
.scen:hover{background:#ffffff08}
.scen.on{background:var(--cyan2);border-left-color:var(--cyan)}
.scen code{color:var(--cyan);font-weight:700;min-width:44px;font-size:11.5px}
.scen span{color:#c7d6dd;font-size:11.5px;line-height:1.35}
.scen small{display:block;color:var(--dim2);font-size:10px;margin-top:2px}
.note{margin:8px 12px 14px;padding:8px 10px;border:1px dashed var(--line2);border-radius:6px;color:var(--dim);font-size:10.5px;line-height:1.5}

/* ---------- centro ---------- */
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.statusbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.statusbar .title{font-family:var(--brand);font-size:15px;margin-right:6px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.statusbar .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.kpi{display:inline-flex;flex-direction:column;padding:4px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel3);min-width:72px}
.kpi b{font-size:15px}
.kpi span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.estado{padding:3px 9px;border-radius:5px;font-weight:700;font-size:11px;border:1px solid}
.estado.concluido{color:var(--ok);border-color:#34d39966;background:#34d3991a}
.estado.aguarda_resposta{color:var(--warn);border-color:#fbbf2466;background:#fbbf241a}
.estado.erro{color:var(--bad);border-color:#fb718566;background:#fb71851a}
.estado.desatualizado{color:var(--dim);border-color:var(--line2)}
.passos{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.pchip{flex-shrink:0;border:1px solid var(--line2);background:var(--panel3);border-radius:5px;padding:3px 7px;font-size:10.5px;color:#b9cbd3;display:inline-flex;gap:5px;align-items:center}
.pchip.focus{border-color:var(--cyan);color:#fff;background:var(--cyan2)}
.pchip.resp{border-color:#34d39977;color:#a7f3d0}
.pchip.on{outline:1px solid #fff}
.pchip i{font-style:normal;color:var(--warn)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line2);flex-shrink:0;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:9px 12px;font-weight:700;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--cyan)}
.tab .cnt{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;background:var(--line2);font-size:10.5px}
.tab .cnt.warn{background:var(--warn);color:#1a1200}
.pane{flex:1;min-height:0;overflow:auto;padding:12px 14px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--dim);height:100%;padding:30px;line-height:1.6}
.empty .big{font-size:30px}
.empty h2{margin:0;color:var(--txt);font-family:var(--brand);font-size:18px}
.inp{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;min-width:260px}
.errbox{border:1px solid #fb718577;background:#fb71851a;color:#fecdd3;border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
.errbox b{color:#fff}
.infobox{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;margin-bottom:12px;color:#c7d6dd;line-height:1.5}

table.t{width:100%;border-collapse:collapse;font-size:11.5px}
.t th{position:sticky;top:-12px;background:var(--panel);text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:7px 8px;border-bottom:1px solid var(--line2);z-index:1}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#ffffff06}
.t tr.sel td{background:var(--cyan2)}
.t tr.dimrow td{opacity:.45}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:10.5px;border:1px solid;white-space:nowrap}
.b-entrada{color:var(--entrada);border-color:#22d3ee66}
.b-inicial{color:var(--inicial);border-color:#94a3b866}
.b-regra{color:var(--regra);border-color:#c084fc66}
.b-closed{color:var(--dim);border-color:var(--line2)}
.b-open{color:var(--ok);border-color:#34d39966}
.term{font-family:var(--mono);word-break:break-word}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:none;padding:5px 10px;color:var(--dim)}
.seg button.on{background:var(--cyan2);color:#fff}
.muted{color:var(--dim)}
.small{font-size:11px}

/* perguntas */
.qcard{border:1px solid #fbbf2466;background:linear-gradient(180deg,#1a1608,#120f07);border-radius:9px;padding:12px 14px;margin-bottom:10px}
.qcard .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:11px;color:var(--dim)}
.qcard .qt{font-size:13px;line-height:1.5;color:#fff7e0;margin-bottom:10px}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{background:#fbbf2414;border:1px solid #fbbf2466;color:#fde68a;border-radius:6px;padding:6px 11px;text-align:left}
.qopt:hover:not(:disabled){background:#fbbf2430;color:#fff}
.ans{display:flex;align-items:center;gap:8px;border:1px solid #34d39955;background:#34d3990f;border-radius:7px;padding:7px 10px;margin-bottom:6px}
.ans code{color:#a7f3d0}

/* grafo */
.gwrap{position:relative;border:1px solid var(--line2);border-radius:8px;background:radial-gradient(circle at 1px 1px,#16273522 1px,transparent 0) 0 0/18px 18px,#070d14;overflow:hidden;height:calc(100% - 44px);min-height:360px;cursor:grab}
.gwrap.drag{cursor:grabbing}
.gwrap svg{position:absolute;left:0;top:0;transform-origin:0 0}
.gnode{cursor:pointer}
.gnode rect{stroke-width:1.4}
.gnode:hover rect{filter:brightness(1.35)}
.gnode.sel rect{stroke:#fff !important;stroke-width:2.2}
.gnode text{font-family:var(--mono);fill:var(--txt);pointer-events:none}
.gedge{fill:none;stroke:#3b5568;stroke-width:1.3}
.gedge.neg{stroke-dasharray:4 3;stroke:#a16207}
.glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1.5px solid}

/* detalhe */
.dhead{padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead .pred{font-size:14px;font-weight:700;margin-bottom:6px;word-break:break-word}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 8px;font-size:11.5px;margin-top:8px}
.kv div:nth-child(odd){color:var(--dim)}
.signif{margin:10px 14px 0;padding:9px 11px;border-left:3px solid var(--cyan);background:#0b2230;border-radius:0 6px 6px 0;font-size:11.5px;line-height:1.5;color:#d6f4fb}
.signif b{display:block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan);margin-bottom:3px}
.dsec{padding:10px 14px}
.dsec h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.how details{margin-left:12px;border-left:1px dashed var(--line2);padding-left:8px}
.how summary{list-style:none;cursor:pointer;padding:3px 0;display:flex;gap:6px;align-items:flex-start;font-size:11.5px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:'▸';color:var(--dim);width:10px;flex-shrink:0}
.how details[open]>summary::before{content:'▾'}
.how details.leaf>summary::before{content:'•'}
.how .cond{margin-left:22px;padding:3px 0;font-size:11.5px;color:#fde68a}
.how .ref{color:var(--dim);font-size:10.5px}
.link{background:none;border:none;color:var(--cyan);padding:0;text-decoration:underline dotted;font-size:inherit}
.uses{display:flex;flex-direction:column;gap:3px}
.uses button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:11px}
.uses button:hover{border-color:var(--cyan3)}

/* comparacao */
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.cmpcard{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:10px}
.cmpcard h4{margin:0 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.cmpcard .v{font-size:13px}
.verdict{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.verdict.ok{background:#34d3991a;border:1px solid #34d39966;color:#a7f3d0}
.verdict.diff{background:#fb71851a;border:1px solid #fb718566;color:#fecdd3}
pre.json{background:#060b11;border:1px solid var(--line2);border-radius:7px;padding:10px;font-size:11px;line-height:1.45;color:#b7e4f0;overflow:auto;max-height:60vh;white-space:pre}
details.box{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);margin-bottom:10px}
details.box>summary{cursor:pointer;padding:9px 12px;font-weight:700}
details.box>div{padding:0 12px 12px}

/* registo */
.logbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:28px;border-top:1px solid var(--line2);background:#091119;font-size:11px;color:var(--dim)}
.logbar .last{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logwrap{display:grid;grid-template-rows:28px minmax(0,1fr);min-height:0}
.app:not(.log-open) .log{display:none}
.log{overflow:auto;padding:4px 12px;background:#070c12;font-size:11px}
.log div{padding:2px 0;border-bottom:1px solid #0f1a24;white-space:pre-wrap;word-break:break-word}
.log .t{color:var(--dim2);margin-right:8px}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .info{color:var(--cyan)}

.toast{position:fixed;right:16px;bottom:44px;max-width:420px;background:#1d0d12;border:1px solid #fb718588;color:#fecdd3;border-radius:8px;padding:10px 12px;line-height:1.45;box-shadow:0 10px 30px #0008;z-index:50;display:none}
.toast.ok{background:#0b1d16;border-color:#34d39988;color:#bbf7d0}
.toast.show{display:block}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #ffffff33;border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1180px){
  .body{grid-template-columns:260px minmax(0,1fr)}
  .detail{position:fixed;right:0;top:54px;bottom:28px;width:min(420px,100vw);z-index:20;box-shadow:-10px 0 30px #0009;display:none}
  .detail.open{display:flex}
}
@media (max-width:760px){
  body{overflow:auto}
  .app{position:static;display:block}
  header{flex-wrap:wrap;height:auto;padding:8px 12px}
  .body{display:block}
  .side{max-height:none}
  .pane{overflow:visible}
}
</style>
</head>
<body>
<div class="app" id="app">

      <button class="icon-btn" id="btnLog" style="padding:1px 8px">▴ Registo</button>
      <span class="last" id="logLast"></span>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Estado
   ===================================================================== */
const S = {
  base: '',              // endereco da API
  online: false,
  health: null,          // resposta de GET /api/health
  cat: null,             // resposta de GET /api/cenarios
  byId: new Map(),       // id do cenario -> entrada do catalogo
  engine: 'prolog',      // 'prolog' | 'drools' | 'both'
  view: 'prolog',        // motor cuja resposta se esta a ver (em 'both')
  sel: null,             // {tipo:'completo', grupos:[...]} | {tipo:'cenario', id}
  grupos: [],            // grupos escolhidos para a execucao completa
  runs: new Map(),       // chave da execucao -> {respostas:[], res:{motor: resultado}}
  tab: 'tickets',
  selFact: null,         // numero do facto selecionado
  graphRoot: null,       // numero do facto na raiz do grafo
  filtro: {tickets: 'abertos', passo: null, origem: 'regra', texto: '', so: true},
  busy: 0,
  reqSeq: 0,
};
const ENGINES = ['prolog', 'drools'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================================================================
   Termos JSON do contrato: atomo -> string, numero, lista -> array,
   composto -> {"f", "args"}
   ===================================================================== */
function fmt(t) {
  if (t === null || t === undefined) return 'null';
  if (Array.isArray(t)) return '[' + t.map(fmt).join(', ') + ']';
  if (typeof t === 'object' && 'f' in t) return t.f + '(' + (t.args || []).map(fmt).join(', ') + ')';
  if (typeof t === 'object') return JSON.stringify(t);
  return String(t);
}
const fmtFact = f => f.predicado + '(' + (f.args || []).map(fmt).join(', ') + ')';
const keyOf = t => JSON.stringify(t);
function atomsOf(t, out = new Set()) {
  if (Array.isArray(t)) t.forEach(x => atomsOf(x, out));
  else if (t && typeof t === 'object') { if (t.f) out.add(t.f); (t.args || []).forEach(x => atomsOf(x, out)); }
  else if (typeof t === 'string') out.add(t);
  return out;
}

/* =====================================================================
   Rede
   ===================================================================== */
async function api(path, opts = {}, timeoutMs = 120000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = performance.now();
  try {
    const res = await fetch(S.base + path, {...opts, signal: ctrl.signal});
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = null; }
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) {
      const msg = (data && data.erro) || txt.slice(0, 300) || res.statusText;
      return {ok: false, status: res.status, data, ms, erro: msg};
    }
    if (data === null) return {ok: false, status: res.status, data, ms, erro: 'a resposta nao e JSON'};
    return {ok: true, status: res.status, data, ms};
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    return {ok: false, status: 0, data: null, ms, erro: e.name === 'AbortError' ? 'sem resposta dentro do tempo limite' : e.message};
  } finally { clearTimeout(timer); }
}
const HTTP_TXT = {0: 'sem ligação', 400: 'pedido inválido', 404: 'não encontrado', 415: 'Content-Type errado', 500: 'o motor falhou', 503: 'motor ocupado', 504: 'o motor não respondeu a tempo'};

/* =====================================================================
   Registo e avisos
   ===================================================================== */
function log(msg, cls = '') {
  const t = new Date().toLocaleTimeString('pt-PT');
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">${t}</span><span class="${cls}">${esc(msg)}</span>`;
  $('log').prepend(d);
  $('logLast').innerHTML = `<span class="${cls}">${esc(msg)}</span>`;
}
let toastTimer = null;
function toast(msg, ok = false) {
  const el = $('toast');
  el.className = 'toast show' + (ok ? ' ok' : '');
  el.innerHTML = esc(msg);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 6000);
}

/* =====================================================================
   Ligacao: GET /api/health e GET /api/cenarios
   ===================================================================== */
function defaultBase() {
  try { const s = localStorage.getItem('cr-api-base'); if (s) return s; } catch {}
  return /^https?:/.test(location.protocol) ? location.origin : 'http://localhost:8080';
}
async function connect(base) {
  S.base = (base || S.base || defaultBase()).replace(/\/+$/, '');
  try { localStorage.setItem('cr-api-base', S.base); } catch {}
  $('apiDot').className = 'dot wait';
  $('apiTxt').textContent = 'A ligar a ' + S.base;
  log(`GET ${S.base}/api/health e /api/cenarios`, 'info');
  const [h, c] = await Promise.all([api('/api/health', {}, 6000), api('/api/cenarios', {}, 6000)]);
  if (!h.ok || !c.ok) {
    S.online = false; S.health = null; S.cat = null;
    const r = !h.ok ? h : c;
    $('apiDot').className = 'dot bad';
    $('apiTxt').textContent = 'API indisponível';
    log(`Sem ligação à API (${r.status ? 'HTTP ' + r.status + ': ' : ''}${r.erro})`, 'bad');
    renderAll();
    return;
  }
  S.online = true;
  S.health = h.data;
  S.cat = c.data;
  S.byId = new Map((S.cat.cenarios || []).map(x => [x.id, x]));
  const seqs = Object.keys(S.cat.sequencias || {});
  if (!S.grupos.length) S.grupos = seqs.slice();
  S.grupos = S.grupos.filter(g => seqs.includes(g));
  // motor por omissao: o escolhido, se estiver pronto; senao o primeiro pronto
  const ready = readyEngines();
  if (S.engine !== 'both' && !ready.includes(S.engine) && ready.length) S.engine = ready[0];
  if (S.engine === 'both' && ready.length < 2) S.engine = ready[0] || 'prolog';
  S.view = S.engine === 'both' ? (ready[0] || 'prolog') : S.engine;
  $('apiDot').className = 'dot ok';
  $('apiTxt').textContent = 'API ' + S.base.replace(/^https?:\/\//, '');
  log(`Ligado. Base de conhecimento v${S.cat.versaoKB}: ${S.cat.cenarios.length} entradas no catálogo, sequências: ${seqs.join(', ')}`, 'ok');
  if (!S.sel) S.sel = {tipo: 'completo'};
  renderAll();
}
function engineHealth(m) {
  return (S.health?.motores || []).find(x => x.motor === m) || null;
}
function readyEngines() {
  return ENGINES.filter(m => engineHealth(m)?.pronto);
}

/* =====================================================================
   Passos a enviar (sempre a partir do catalogo da API)
   ===================================================================== */
// passos de uma sequencia completa, pela ordem das sequencias da API
function idsCompleto() {
  const seqs = S.cat.sequencias || {};
  const out = [], seen = new Set();
  Object.keys(seqs).filter(g => S.grupos.includes(g)).forEach(g =>
    seqs[g].forEach(id => { if (!seen.has(id)) { seen.add(id); out.push(id); } }));
  return out;
}
// cadeia de um cenario: as dependencias (campo "depende") antes do proprio cenario
function idsCadeia(id) {
  const out = [], seen = new Set();
  const visit = (x, stack) => {
    if (seen.has(x)) return;
    if (stack.has(x)) throw new Error('dependência circular em ' + x);
    const c = S.byId.get(x);
    if (!c) throw new Error('o catálogo não tem o cenário ' + x);
    stack.add(x);
    (c.depende || []).forEach(d => visit(d, stack));
    stack.delete(x);
    seen.add(x); out.push(x);
  };
  visit(id, new Set());
  return out;
}
function runKey(sel = S.sel) {
  if (!sel) return '';
  return sel.tipo === 'completo' ? 'completo:' + idsCompleto().join(',') : 'cenario:' + sel.id;
}
function curRun() {
  const k = runKey();
  if (!k) return null;
  if (!S.runs.has(k)) S.runs.set(k, {respostas: [], res: {}});
  return S.runs.get(k);
}
function idsBase() {
  if (!S.sel || !S.cat) return [];
  return S.sel.tipo === 'completo' ? idsCompleto() : idsCadeia(S.sel.id);
}
function passosAtuais() {
  const run = curRun();
  const passos = idsBase().map(id => {
    const c = S.byId.get(id);
    if (!c || !c.passo) throw new Error('o catálogo não tem o passo de ' + id);
    return c.passo;
  });
  return passos.concat(run ? run.respostas : []);
}
const sigOf = passos => JSON.stringify(passos);
// passos que pertencem a uma sequencia (os restantes sao respostas preparadas e nao se enviam)
function idsEmSequencias() {
  const s = new Set();
  Object.values(S.cat?.sequencias || {}).forEach(l => l.forEach(id => s.add(id)));
  return s;
}

/* =====================================================================
   Inferencia: POST /api/{motor}/infer
   ===================================================================== */
async function correr(motivo = '', only = null) {
  if (!S.online || !S.sel) return;
  let passos;
  try { passos = passosAtuais(); }
  catch (e) { toast(e.message); log(e.message, 'bad'); return; }
  const run = curRun();
  const sig = sigOf(passos);
  const engines = only || (S.engine === 'both' ? readyEngines() : [S.engine]);
  const pedido = {versaoKB: S.cat.versaoKB, passos};
  const seq = ++S.reqSeq;
  lembrarSelecao();
  S.busy++;
  renderStatus();
  await Promise.all(engines.map(async m => {
    log(`POST /api/${m}/infer · ${passos.length} passos${motivo ? ' · ' + motivo : ''}`, 'info');
    const r = await api(`/api/${m}/infer`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(pedido)});
    const res = {sig, pedido, ms: r.ms, status: r.status, at: new Date()};
    if (r.ok && r.data.estado !== 'erro') {
      res.resposta = r.data;
      res.idx = indexar(r.data);
      log(`${m}: HTTP ${r.status} em ${r.ms} ms · ${r.data.estado} · ${r.data.tickets?.length ?? 0} tickets · ${r.data.perguntas?.length ?? 0} perguntas · ${r.data.factos?.length ?? 0} factos`, 'ok');
    } else {
      res.erro = r.erro || r.data?.erro || 'erro desconhecido';
      res.corpoErro = r.data;
      log(`${m}: HTTP ${r.status || '—'} (${HTTP_TXT[r.status] || 'erro'}): ${res.erro}`, 'bad');
      toast(`${m}: ${HTTP_TXT[r.status] || 'erro'}: ${res.erro}`);
    }
    run.res[m] = res;
  }));
  S.busy--;
  // se entretanto o utilizador mudou de execucao, o resultado fica guardado nessa execucao e nao mexe no ecra atual
  if (runKey() === runKeyAt(run) && seq === S.reqSeq) {
    if (S.engine !== 'both') S.view = S.engine;
    reconciliarSelecao(); // o mesmo facto (pelo conteudo) na resposta nova
  }
  renderAll();
}
function runKeyAt(run) { for (const [k, v] of S.runs) if (v === run) return k; return ''; }

function indexar(resp) {
  const byNum = new Map();
  const usedBy = new Map();
  const signif = new Map();
  for (const f of resp.factos || []) {
    byNum.set(f.numero, f);
    for (const p of f.premissas || []) if (typeof p === 'number') {
      if (!usedBy.has(p)) usedBy.set(p, []);
      usedBy.get(p).push(f.numero);
    }
    if (f.predicado === 'significado' && f.args?.length >= 2 && typeof f.args[0] === 'string') signif.set(f.args[0], f.args[1]);
  }
  // ordens da propria base: nivel_abaixo(Mais, Menos) e prioridade_acima(Menos, Mais)
  const chainRank = (pred, upward) => {
    const next = new Map();
    for (const f of resp.factos || []) if (f.predicado === pred && f.args?.length === 2) next.set(keyOf(f.args[0]), keyOf(f.args[1]));
    const rank = new Map();
    for (const k of next.keys()) { let n = 0, x = k; const seen = new Set(); while (next.has(x) && next.get(x) !== x && !seen.has(x)) { seen.add(x); x = next.get(x); n++; } rank.set(k, n); }
    return {rank, max: Math.max(0, ...rank.values()), upward};
  };
  return {byNum, usedBy, signif, grav: chainRank('nivel_abaixo'), prio: chainRank('prioridade_acima')};
}
function resAtual() {
  const run = curRun();
  if (!run) return null;
  return run.res[S.view] || null;
}
function resValido(res) {
  if (!res) return false;
  try { return res.sig === sigOf(passosAtuais()); } catch { return false; }
}
function factKey(f) { return f ? f.predicado + keyOf(f.args) : null; }
function lembrarSelecao() {
  const res = resAtual();
  S._selKey = S.selFact != null ? factKey(res?.idx?.byNum.get(S.selFact)) : null;
  S._rootKey = S.graphRoot != null ? factKey(res?.idx?.byNum.get(S.graphRoot)) : null;
}
function reconciliarSelecao() {
  const res = resAtual();
  if (!res?.idx) { S.selFact = null; S.graphRoot = null; return; }
  const find = k => { if (!k) return null; const f = res.resposta.factos.find(x => factKey(x) === k); return f ? f.numero : null; };
  S.selFact = find(S._selKey);
  S.graphRoot = find(S._rootKey);
}

/* =====================================================================
   Respostas do analista: um passo novo com resposta_analista/4 e uma
   nova chamada ao motor com todos os passos (o servidor nao guarda estado)
   ===================================================================== */
async function responder(q, valor) {
  const run = curRun();
  if (!run) return;
  const n = run.respostas.length + 1;
  const passo = {
    id: `resposta_${n}`,
    factos: [{predicado: 'resposta_analista', args: [q.ativo, q.evento, q.pergunta, valor]}]
  };
  run.respostas.push(passo);
  log(`Analista: resposta_analista(${fmt(q.ativo)}, ${fmt(q.evento)}, ${fmt(q.pergunta)}, ${fmt(valor)})`, 'info');
  await correr('resposta do analista');
  const res = resAtual();
  if (res && !res.erro) toast(`Resposta enviada: ${fmt(valor)}. Motor: ${res.resposta.estado}, ${res.resposta.tickets.length} tickets, ${res.resposta.perguntas.length} perguntas por responder.`, true);
}
async function desfazerResposta(i) {
  const run = curRun();
  if (!run) return;
  const [p] = run.respostas.splice(i, 1);
  // renumerar para os ids continuarem seguidos
  run.respostas = run.respostas.map((x, k) => ({...x, id: `resposta_${k + 1}`}));
  log(`Resposta retirada: ${fmtFact(p.factos[0])}`, 'info');
  await correr('resposta retirada');
}

/* =====================================================================
   Desenho: topo
   ===================================================================== */
function renderHeader() {
  const h = $('health');
  if (!S.online) { h.innerHTML = ''; }
  else {
    h.innerHTML = (S.health.motores || []).map(m => {
      const errs = (m.erros || []).join('; ');
      return `<span class="pill" title="${esc(m.pronto ? 'pronto · versaoKB ' + m.versaoKB : 'indisponível: ' + errs)}"><span class="dot ${m.pronto ? 'ok' : 'bad'}"></span>${esc(m.motor)}${m.pronto ? '' : ' · ' + esc(errs || 'indisponível')}</span>`;
    }).join('');
  }
  $('kbTxt').textContent = S.cat ? 'KB v' + S.cat.versaoKB : '';
  const ready = S.online ? readyEngines() : [];
  document.querySelectorAll('#eng button').forEach(b => {
    const e = b.dataset.eng;
    b.classList.toggle('on', e === S.engine);
    b.disabled = !S.online || (e === 'both' ? ready.length < 2 : !ready.includes(e));
  });
}

/* =====================================================================
   Desenho: barra lateral (catalogo)
   ===================================================================== */
function renderSide() {
  const el = $('side');
  if (!S.online) { el.innerHTML = `<div class="note">Sem ligação à API. O catálogo de cenários vem de <code>GET /api/cenarios</code>.</div>`; return; }
  const seqs = S.cat.sequencias || {};
  const isComp = S.sel?.tipo === 'completo';
  const nComp = idsCompleto().length;
  const emSeq = idsEmSequencias();
  const lista = S.cat.cenarios.filter(c => emSeq.has(c.id));
  const fora = S.cat.cenarios.filter(c => !emSeq.has(c.id));
  const q = (S.filtro.cat || '').toLowerCase();
  const grupos = [];
  for (const c of lista) {
    if (q && !(c.id + ' ' + (c.descricao || '')).toLowerCase().includes(q)) continue;
    let g = grupos.find(x => x.nome === c.grupo);
    if (!g) grupos.push(g = {nome: c.grupo, itens: []});
    g.itens.push(c);
  }
  el.innerHTML = `
    <div class="runcard ${isComp ? 'on' : ''}">
      <h3>▣ Execução completa</h3>
      <p>Envia de uma vez os passos das sequências escolhidas, pela ordem da base de conhecimento.</p>
      ${Object.keys(seqs).map(g => `
        <label class="grp"><input type="checkbox" data-grp="${esc(g)}" ${S.grupos.includes(g) ? 'checked' : ''}>
          <span>${esc(g)}</span><span class="n">${seqs[g].length} passos</span></label>`).join('')}
      <button class="btn w100" id="btnCompleto" style="margin-top:8px" ${nComp ? '' : 'disabled'}>▶ Correr ${nComp} passos</button>
    </div>
    <div class="sec-h" style="padding-top:2px"><span>Cenário individual</span><span>${lista.length}</span></div>
    <input class="search" id="catSearch" placeholder="Procurar cenário…" value="${esc(S.filtro.cat || '')}">
    ${grupos.map(g => `
      <div class="scen-grp">${esc(g.nome)}</div>
      ${g.itens.map(c => `
        <button class="scen ${S.sel?.tipo === 'cenario' && S.sel.id === c.id ? 'on' : ''}" data-scen="${esc(c.id)}" title="${esc((c.depende || []).length ? 'Envia também a cadeia de dependências: ' + safeChain(c.id) : 'Sem dependências')}">
          <code>${esc(c.id)}</code><span>${esc(c.descricao || '')}<small>${(c.depende || []).length ? 'depende de ' + esc(c.depende.join(', ')) : 'sem dependências'}</small></span>
        </button>`).join('')}`).join('')}
    ${fora.length ? `<div class="note">${fora.length} entradas do catálogo não pertencem a nenhuma sequência (respostas preparadas: ${esc(fora.map(c => c.id).join(', '))}). Não são enviadas: as respostas vêm do analista, no separador <b>Perguntas</b>.</div>` : ''}
  `;
}
function safeChain(id) { try { return idsCadeia(id).join(' → '); } catch (e) { return e.message; } }

/* =====================================================================
   Desenho: barra de estado e passos
   ===================================================================== */
function renderStatus() {
  const sb = $('statusbar');
  if (!S.online) { sb.innerHTML = `<span class="title">Sem ligação</span>`; $('passos').style.display = 'none'; return; }
  const res = resAtual();
  const valido = resValido(res);
  const r = res && !res.erro ? res.resposta : null;
  const titulo = S.sel?.tipo === 'cenario'
    ? `${S.sel.id} · ${S.byId.get(S.sel.id)?.descricao || ''}`
    : `Execução completa · ${S.grupos.join(' + ') || 'nenhuma sequência'}`;
  const engTabs = S.engine === 'both' ? `<span class="seg" id="viewSeg">${readyEngines().map(m => `<button data-view="${m}" class="${S.view === m ? 'on' : ''}">${m}</button>`).join('')}</span>` : '';
  let estado = '';
  if (S.busy) estado = `<span class="estado desatualizado"><span class="spin"></span> a inferir…</span>`;
  else if (res?.erro) estado = `<span class="estado erro">erro ${res.status || ''}</span>`;
  else if (r && !valido) estado = `<span class="estado desatualizado">desatualizado: correr de novo</span>`;
  else if (r) estado = `<span class="estado ${esc(r.estado)}">${esc(r.estado)}</span>`;
  const abertos = r ? r.tickets.filter(t => t.fechado == null).length : 0;
  const kpis = r ? `<span class="kpis">
    <span class="kpi"><b>${abertos}</b><span>tickets abertos</span></span>
    <span class="kpi"><b>${r.tickets.length - abertos}</b><span>fechados</span></span>
    <span class="kpi"><b style="color:${r.perguntas.length ? 'var(--warn)' : 'inherit'}">${r.perguntas.length}</b><span>perguntas</span></span>
    <span class="kpi"><b>${r.incidentes?.length ?? 0}</b><span>incidentes</span></span>
    <span class="kpi"><b>${r.factos.length}</b><span>factos</span></span>
    <span class="kpi"><b>${res.ms}</b><span>ms · ${esc(r.motor || S.view)}</span></span></span>` : '';
  sb.innerHTML = `<div class="head"><span class="title">${esc(titulo)}</span>${estado}${engTabs}<span class="hgrow"></span>
    <button class="btn ghost small" id="btnRerun" ${S.busy || !S.sel ? 'disabled' : ''}>↻ Correr de novo</button></div>${kpis}`;
  renderPassos(res);
}
function renderPassos(res) {
  const el = $('passos');
  let passos;
  try { passos = passosAtuais(); } catch { passos = []; }
  if (!passos.length) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const porPasso = new Map();
  if (res?.resposta && !res.erro && resValido(res)) {
    for (const t of res.resposta.tickets) {
      const p = res.idx.byNum.get(t.facto)?.passo;
      if (p != null) porPasso.set(p, (porPasso.get(p) || 0) + 1);
    }
  }
  const respIds = new Set((curRun()?.respostas || []).map(p => p.id));
  const focus = S.sel?.tipo === 'cenario' ? S.sel.id : null;
  el.innerHTML = `<span class="pchip" style="border:none;background:none;color:var(--dim)">${passos.length} passos:</span>` + passos.map(p => {
    const n = porPasso.get(p.id);
    const cls = ['pchip', p.id === focus ? 'focus' : '', respIds.has(p.id) ? 'resp' : '', S.filtro.passo === p.id ? 'on' : ''].join(' ');
    return `<button class="${cls}" data-passo="${esc(p.id)}" title="${esc(p.factos.map(fmtFact).join('\n'))}">${esc(p.id)}${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('');
}

/* =====================================================================
   Desenho: separadores
   ===================================================================== */
const TABS = [
  ['tickets', 'Tickets'], ['perguntas', 'Perguntas'], ['grafo', 'Grafo de prova'],
  ['factos', 'Factos'], ['comparar', 'Comparação'], ['json', 'Pedido / Resposta'],
];
function renderTabs() {
  if (!S.online) { $('tabs').innerHTML = ''; return; }
  const res = resAtual();
  const r = res?.resposta && !res.erro ? res.resposta : null;
  const cnt = {tickets: r?.tickets.length, perguntas: r?.perguntas.length, factos: r?.factos.length};
  $('tabs').innerHTML = TABS.filter(([k]) => k !== 'comparar' || S.engine === 'both').map(([k, l]) =>
    `<button class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}${cnt[k] != null ? `<span class="cnt ${k === 'perguntas' && cnt[k] ? 'warn' : ''}">${cnt[k]}</span>` : ''}</button>`).join('');
}
function renderPane() {
  const el = $('pane');
  if (!S.online) {
    el.innerHTML = `<div class="empty"><div class="big">📡</div><h2>Sem ligação à API</h2>
      <div>O dashboard não tem dados próprios: o catálogo, as inferências e as explicações vêm do backend.<br>Confirme que o Spring Boot está a correr e indique o endereço.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><input class="inp" id="apiInput" value="${esc(S.base || defaultBase())}"><button class="btn" id="btnConnect">Ligar</button></div></div>`;
    return;
  }
  if (S.tab === 'comparar' && S.engine !== 'both') S.tab = 'tickets';
  const res = resAtual();
  if (S.tab === 'json') return renderJson(el, res);
  if (S.tab === 'comparar') return renderComparar(el);
  if (!res) {
    el.innerHTML = `<div class="empty"><div class="big">▶</div><h2>Ainda sem inferência</h2><div>Escolha uma execução à esquerda: a execução completa ou um cenário individual.</div></div>`;
    return;
  }
  if (res.erro) {
    el.innerHTML = `<div class="errbox"><b>${esc(S.view)} · HTTP ${res.status || '—'} (${esc(HTTP_TXT[res.status] || 'erro')})</b><br>${esc(res.erro)}
      ${res.status === 503 || res.status === 504 || res.status === 0 ? `<div style="margin-top:8px"><button class="btn small" id="btnRetry">Tentar de novo</button></div>` : ''}</div>`;
    return;
  }
  let aviso = '';
  if (!resValido(res)) aviso = `<div class="infobox">Esta resposta corresponde a outro conjunto de passos. Carregue em <b>↻ Correr de novo</b>.</div>`;
  const f = {tickets: renderTickets, perguntas: renderPerguntas, grafo: renderGrafo, factos: renderFactos}[S.tab];
  f(el, res, aviso);
}

/* ----- Tickets ----- */
function sevStyle(idx, kind, val) {
  const c = kind === 'grav' ? idx.grav : idx.prio;
  const r = c.rank.get(keyOf(val));
  if (r === undefined || !c.max) return 'color:var(--txt);border-color:var(--line2)';
  // gravidade: mais passos ate ao fim = mais grave; prioridade: menos passos ate ao topo = mais urgente
  const lvl = kind === 'grav' ? r / c.max : 1 - r / c.max;
  const v = ['--sev0', '--sev1', '--sev2', '--sev3'][Math.round(lvl * 3)];
  return `color:var(${v});border-color:var(${v})`;
}
function rankNum(idx, kind, val) { const c = kind === 'grav' ? idx.grav : idx.prio; const r = c.rank.get(keyOf(val)); return r === undefined ? 99 : (kind === 'grav' ? -r : r); }
function focoPassos() {
  const s = new Set((curRun()?.respostas || []).map(p => p.id));
  if (S.sel?.tipo === 'cenario') s.add(S.sel.id);
  return s;
}
function renderTickets(el, res, aviso) {
  const r = res.resposta, idx = res.idx;
  const foco = S.sel?.tipo === 'cenario' ? focoPassos() : null;
  let ts = r.tickets.map(t => ({t, f: idx.byNum.get(t.facto)}));
  if (S.filtro.tickets === 'abertos') ts = ts.filter(x => x.t.fechado == null);
  if (S.filtro.tickets === 'fechados') ts = ts.filter(x => x.t.fechado != null);
  if (S.filtro.passo) ts = ts.filter(x => x.f?.passo === S.filtro.passo);
  if (foco && S.filtro.so) ts = ts.filter(x => foco.has(x.f?.passo));
  ts.sort((a, b) => rankNum(idx, 'prio', a.t.prioridade) - rankNum(idx, 'prio', b.t.prioridade)
    || rankNum(idx, 'grav', a.t.gravidade) - rankNum(idx, 'grav', b.t.gravidade) || a.t.facto - b.t.facto);
  el.innerHTML = `${aviso}
    <div class="toolbar">
      <span class="seg" data-filtro="tickets">${['abertos', 'fechados', 'todos'].map(v => `<button data-v="${v}" class="${S.filtro.tickets === v ? 'on' : ''}">${v}</button>`).join('')}</span>
      ${foco ? `<label class="small"><input type="checkbox" id="soFoco" ${S.filtro.so ? 'checked' : ''}> só os criados em ${esc(S.sel.id)}${(curRun()?.respostas.length) ? ' e nas respostas' : ''} (o resto é contexto da cadeia)</label>` : ''}
      ${S.filtro.passo ? `<span class="pill">passo ${esc(S.filtro.passo)} <button class="link" id="clrPasso">limpar</button></span>` : ''}
      <span class="muted small" style="margin-left:auto">${ts.length} de ${r.tickets.length}</span>
    </div>
    ${ts.length ? `<table class="t"><thead><tr><th>Prioridade</th><th>Gravidade</th><th>Ativo</th><th>Ação</th><th>Incidente</th><th>Passo</th><th>Estado</th></tr></thead><tbody>
    ${ts.map(({t, f}) => `<tr class="row ${S.selFact === t.facto ? 'sel' : ''}" data-fact="${t.facto}">
      <td><span class="badge" style="${sevStyle(idx, 'prio', t.prioridade)}">${esc(fmt(t.prioridade))}</span></td>
      <td><span class="badge" style="${sevStyle(idx, 'grav', t.gravidade)}">${esc(fmt(t.gravidade))}</span></td>
      <td>${esc(fmt(t.ativo))}${Array.isArray(t.impactados) && t.impactados.length > 1 ? `<div class="muted small">+ ${esc(t.impactados.filter(x => keyOf(x) !== keyOf(t.ativo)).map(fmt).join(', '))}</div>` : ''}</td>
      <td class="term">${esc(fmt(t.acao))}</td>
      <td class="term">${esc(fmt(t.incidente))}</td>
      <td>${esc(f?.passo ?? '—')}</td>
      <td>${t.fechado == null ? '<span class="badge b-open">aberto</span>' : `<span class="badge b-closed" title="${esc(fmt(t.fechado))}">fechado</span><div class="muted small term">${esc(fmt(t.fechado))}</div>`}</td>
    </tr>`).join('')}</tbody></table>` : `<div class="empty" style="height:auto"><div>Nenhum ticket com estes filtros.</div></div>`}`;
}

          : `<span class="muted">A base não define opções para esta pergunta.</span>`}</div>
      </div>`).join('')
    : `<div class="empty" style="height:auto;padding:40px"><div class="big">✓</div><h2>Sem perguntas por responder</h2><div>Estado do motor: <b>${esc(r.estado)}</b>.</div></div>`}`;

function perguntasUniao() {
  const run = curRun();
  const m = new Map();
  for (const e of readyEngines()) {
    const res = run.res[e];
    if (!res?.resposta || res.erro) continue;
    for (const q of res.resposta.perguntas) {
      const k = keyOf([q.ativo, q.evento, q.pergunta]);
      if (!m.has(k)) m.set(k, {q: e === S.view ? q : {...q, facto: null}, motores: []});
      else if (e === S.view) m.get(k).q = q;
      m.get(k).motores.push(e);
    }
  }
  return [...m.values()];
}
function tempoDe(res, ev) {
  const f = (res.resposta.factos || []).find(x => x.predicado === 'tempo' && keyOf(x.args?.[0]) === keyOf(ev));
  return f ? ` <span class="muted">(t = ${esc(fmt(f.args[1]))} s)</span>` : '';
}

/* ----- Comparacao Prolog vs Drools (pelo conteudo, nunca pelos numeros) ----- */
function renderComparar(el) {
  const run = curRun();
  const [a, b] = ENGINES.map(m => run?.res[m]);
  if (!a || !b) { el.innerHTML = `<div class="empty"><div>Corra a execução com os dois motores.</div></div>`; return; }
  if (a.erro || b.erro) { el.innerHTML = `<div class="errbox">${[a, b].map((x, i) => x.erro ? `<b>${ENGINES[i]}</b>: ${esc(x.erro)}` : '').filter(Boolean).join('<br>')}</div>`; return; }
  if (a.sig !== b.sig) { el.innerHTML = `<div class="infobox">As duas respostas são de pedidos diferentes. Corra de novo.</div>`; return; }
  const A = a.resposta, B = b.resposta;
  const conj = (lst, kf) => { const m = new Map(); lst.forEach(x => m.set(kf(x), x)); return m; };
  const diff = (ma, mb) => [[...ma.keys()].filter(k => !mb.has(k)), [...mb.keys()].filter(k => !ma.has(k))];
  const kFacto = f => f.predicado + keyOf(f.args);
  const kTicket = t => keyOf([t.incidente, t.ativo, t.acao, t.gravidade, t.prioridade, t.impactados, t.fechado]);
  const kPerg = q => keyOf([q.ativo, q.evento, q.pergunta]);
  const sets = [
    ['Tickets', A.tickets, B.tickets, kTicket, t => `${fmt(t.prioridade)} · ${fmt(t.ativo)} · ${fmt(t.acao)} · ${fmt(t.incidente)}${t.fechado != null ? ' · fechado: ' + fmt(t.fechado) : ''}`],
    ['Perguntas', A.perguntas, B.perguntas, kPerg, q => `${fmt(q.pergunta)} · ${fmt(q.ativo)} · ${fmt(q.evento)}`],
    ['Factos concluídos (origem regra)', A.factos.filter(f => f.origem === 'regra'), B.factos.filter(f => f.origem === 'regra'), kFacto, fmtFact],
    ['Factos de entrada', A.factos.filter(f => f.origem === 'entrada'), B.factos.filter(f => f.origem === 'entrada'), kFacto, fmtFact],
  ].map(([nome, la, lb, kf, show]) => {
    const ma = conj(la, kf), mb = conj(lb, kf);
    const [soA, soB] = diff(ma, mb);
    return {nome, na: ma.size, nb: mb.size, soA: soA.map(k => show(ma.get(k))), soB: soB.map(k => show(mb.get(k)))};
  });
  const total = sets.reduce((s, x) => s + x.soA.length + x.soB.length, 0);
  el.innerHTML = `
    <div class="verdict ${total ? 'diff' : 'ok'}">${total ? `${total} diferenças entre ${ENGINES[0]} e ${ENGINES[1]} para o mesmo pedido` : `Mesmo conteúdo nos dois motores para este pedido (${a.pedido.passos.length} passos)`}</div>
    <div class="muted small" style="margin-bottom:10px">Compara-se o conteúdo dos factos, tickets e perguntas, nunca os números dos factos nem a ordem de disparo. Estado: ${ENGINES[0]} <b>${esc(A.estado)}</b> (${a.ms} ms) · ${ENGINES[1]} <b>${esc(B.estado)}</b> (${b.ms} ms).</div>
    <div class="cmpgrid">${sets.map(s => `<div class="cmpcard"><h4>${esc(s.nome)}</h4><div class="v">${ENGINES[0]}: <b>${s.na}</b> · ${ENGINES[1]}: <b>${s.nb}</b></div>
      <div class="small" style="margin-top:4px;color:${s.soA.length + s.soB.length ? 'var(--bad)' : 'var(--ok)'}">${s.soA.length + s.soB.length ? `${s.soA.length} só no ${ENGINES[0]} · ${s.soB.length} só no ${ENGINES[1]}` : 'iguais'}</div></div>`).join('')}</div>
    ${sets.filter(s => s.soA.length + s.soB.length).map(s => `
      <details class="box"><summary>${esc(s.nome)}: ${s.soA.length + s.soB.length} diferenças</summary><div>
        ${s.soA.length ? `<div class="small muted" style="margin:4px 0">Só no ${ENGINES[0]} (${s.soA.length})</div>${s.soA.slice(0, 300).map(x => `<div class="term small">− ${esc(x)}</div>`).join('')}` : ''}
        ${s.soB.length ? `<div class="small muted" style="margin:8px 0 4px">Só no ${ENGINES[1]} (${s.soB.length})</div>${s.soB.slice(0, 300).map(x => `<div class="term small">+ ${esc(x)}</div>`).join('')}` : ''}
      </div></details>`).join('')}`;
}

/* =====================================================================
   Grafo de prova: construido so com factos[].premissas e factos[].regra
   facto concluido <- regra <- premissas (factos ou condicoes)
   ===================================================================== */
const G = {zoom: 1, x: 20, y: 20, hideInicial: false, depth: 0};
function buildProofGraph(idx, root, maxDepth, hideInicial) {
  const nodes = new Map(), edges = [];
  const add = (id, n) => { if (!nodes.has(id)) nodes.set(id, n); return id; };
  const visit = (num, depth) => {
    const f = idx.byNum.get(num);
    const id = 'f' + num;
    if (!f) { add(id, {id, kind: 'missing', label: '#' + num}); return id; }
    if (nodes.has(id)) return id;
    add(id, {id, kind: 'fact', f});
    if (f.origem !== 'regra' || (maxDepth && depth >= maxDepth)) { if (f.origem === 'regra' && f.premissas?.length) nodes.get(id).more = true; return id; }
    const rid = add('r' + num, {id: 'r' + num, kind: 'rule', regra: f.regra, of: num});
    edges.push([rid, id]);
    (f.premissas || []).forEach((p, i) => {
      if (typeof p === 'number') {
        const pf = idx.byNum.get(p);
        if (hideInicial && pf && pf.origem === 'inicial') return;
        edges.push([visit(p, depth + 1), rid]);
      } else {
        const cid = add(`c${num}_${i}`, {id: `c${num}_${i}`, kind: 'cond', t: p, neg: p && p.f === 'nao'});
        edges.push([cid, rid]);
      }
    });
    return id;
  };
  visit(root, 0);
  return {nodes, edges};
}
function layoutGraph(g, rootId) {
  // camada = caminho mais longo ate a raiz (a raiz fica a direita)
  const dist = new Map([[rootId, 0]]);
  const into = new Map(); // destino -> origens
  for (const [s, t] of g.edges) { if (!into.has(t)) into.set(t, []); into.get(t).push(s); }
  let changed = true, guard = 0;
  while (changed && guard++ < 500) {
    changed = false;
    for (const [s, t] of g.edges) {
      if (!dist.has(t)) continue;
      const d = dist.get(t) + 1;
      if ((dist.get(s) ?? -1) < d) { dist.set(s, d); changed = true; }
    }
  }
  const maxD = Math.max(0, ...dist.values());
  const cols = Array.from({length: maxD + 1}, () => []);
  // ordem inicial: descoberta em profundidade a partir da raiz
  const seen = new Set();
  const dfs = id => { if (seen.has(id)) return; seen.add(id); cols[dist.get(id) ?? 0].push(id); (into.get(id) || []).forEach(dfs); };
  dfs(rootId);
  for (const id of g.nodes.keys()) if (!seen.has(id)) { seen.add(id); cols[dist.get(id) ?? 0].push(id); }
  const outTo = new Map();
  for (const [s, t] of g.edges) { if (!outTo.has(s)) outTo.set(s, []); outTo.get(s).push(t); }
  for (let it = 0; it < 4; it++) {
    for (let c = 1; c <= maxD; c++) {
      const pos = new Map(cols[c - 1].map((id, i) => [id, i]));
      const bc = id => { const ts = (outTo.get(id) || []).filter(t => pos.has(t)); return ts.length ? ts.reduce((s, t) => s + pos.get(t), 0) / ts.length : 1e9; };
      cols[c] = cols[c].map((id, i) => [id, bc(id), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);
    }
  }
  const W = {fact: 230, missing: 230, cond: 230, rule: 64};
  const H = {fact: 46, missing: 30, cond: 30, rule: 24};
  const GAPX = 46, GAPY = 12;
  const colW = cols.map(ids => Math.max(40, ...ids.map(id => W[g.nodes.get(id).kind])));
  const colH = cols.map(ids => ids.reduce((s, id) => s + H[g.nodes.get(id).kind] + GAPY, 0));
  const maxH = Math.max(...colH);
  const pos = new Map();
  let x = 0;
  for (let c = maxD; c >= 0; c--) {
    let y = (maxH - colH[c]) / 2;
    for (const id of cols[c]) {
      const k = g.nodes.get(id).kind;
      pos.set(id, {x: x + (colW[c] - W[k]) / 2, y, w: W[k], h: H[k]});
      y += H[k] + GAPY;
    }
    x += colW[c] + GAPX;
  }
  return {pos, width: x - GAPX, height: maxH};
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function renderGrafo(el, res, aviso) {
  const idx = res.idx;
  const r = res.resposta;
  if (S.graphRoot == null || !idx.byNum.has(S.graphRoot)) {
    // raiz por omissao: o facto selecionado, senao o primeiro ticket aberto mais urgente
    const cand = S.selFact != null && idx.byNum.has(S.selFact) ? S.selFact
      : [...r.tickets].filter(t => t.fechado == null).filter(t => !S.sel || S.sel.tipo !== 'cenario' || focoPassos().has(idx.byNum.get(t.facto)?.passo)).sort((a, b) => rankNum(idx, 'prio', a.prioridade) - rankNum(idx, 'prio', b.prioridade))[0]?.facto ?? r.tickets[0]?.facto;
    S.graphRoot = cand ?? null;
  }
  if (S.graphRoot == null) { el.innerHTML = `${aviso}<div class="empty"><div>Selecione um ticket ou um facto para ver a sua prova.</div></div>`; return; }
  const root = idx.byNum.get(S.graphRoot);
  const g = buildProofGraph(idx, S.graphRoot, G.depth, G.hideInicial);
  const L = layoutGraph(g, 'f' + S.graphRoot);
  const nR = [...g.nodes.values()].filter(n => n.kind === 'rule').length;
  el.innerHTML = `${aviso}
    <div class="toolbar">
      <span>Prova de <b class="term">${esc(trunc(fmtFact(root), 90))}</b></span>
      <span class="muted small">${g.nodes.size - nR} factos/condições · ${nR} regras</span>
      <span class="hgrow"></span>
      <label class="small"><input type="checkbox" id="gHide" ${G.hideInicial ? 'checked' : ''}> esconder factos da base</label>
      <select id="gDepth" title="Profundidade">${[0, 1, 2, 3, 4, 6].map(d => `<option value="${d}" ${G.depth === d ? 'selected' : ''}>${d ? d + ' níveis' : 'prova completa'}</option>`).join('')}</select>
      <span class="seg"><button id="gZoomOut">−</button><button id="gFit">ajustar</button><button id="gZoomIn">+</button></span>
    </div>
    <div class="glegend" style="margin-bottom:8px">
      <span><i style="border-color:var(--entrada)"></i>entrada (telemetria / resposta)</span>
      <span><i style="border-color:var(--inicial)"></i>inicial (base)</span>
      <span><i style="border-color:var(--regra)"></i>concluído por regra</span>
      <span><i style="border-color:var(--rulepill);border-radius:8px"></i>regra</span>
      <span><i style="border-color:var(--cond);border-style:dashed"></i>condição calculada / negação</span>
      <span class="muted">clique: explicar · duplo clique: centrar a prova nesse facto</span>
    </div>
    <div class="gwrap" id="gwrap"><svg id="gsvg" width="${L.width + 40}" height="${L.height + 40}" xmlns="http://www.w3.org/2000/svg"></svg></div>`;
  const svg = $('gsvg');
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const gE = mk('g', {}, svg), gN = mk('g', {}, svg);
  for (const [s, t] of g.edges) {
    const a = L.pos.get(s), b = L.pos.get(t);
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
    mk('path', {d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, class: 'gedge' + (g.nodes.get(s).neg ? ' neg' : '')}, gE);
  }
  for (const [id, n] of g.nodes) {
    const p = L.pos.get(id);
    const grp = mk('g', {class: 'gnode' + (n.kind === 'fact' && n.f.numero === S.selFact ? ' sel' : ''), transform: `translate(${p.x},${p.y})`}, gN);
    const title = mk('title', {}, grp);
    if (n.kind === 'rule') {
      mk('rect', {width: p.w, height: p.h, rx: 12, fill: '#0b2233', stroke: 'var(--rulepill)'}, grp);
      mk('text', {x: p.w / 2, y: 16, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700}, grp).textContent = 'R' + fmt(n.regra);
      title.textContent = `Regra ${fmt(n.regra)} concluiu o facto #${n.of}`;
      grp.dataset.fact = n.of;
    } else if (n.kind === 'cond') {
      mk('rect', {width: p.w, height: p.h, rx: 5, fill: '#1a1406', stroke: 'var(--cond)', 'stroke-dasharray': '4 3'}, grp);
      const txt = n.neg ? 'não ' + fmt(n.t.args?.[0]) : fmt(n.t);
      mk('text', {x: 9, y: 19, 'font-size': 10.5, fill: '#fde68a'}, grp).textContent = trunc(txt, 33);
      title.textContent = (n.neg ? 'Negação: não existe ' : 'Condição calculada: ') + (n.neg ? fmt(n.t.args?.[0]) : fmt(n.t));
    } else if (n.kind === 'missing') {
      mk('rect', {width: p.w, height: p.h, rx: 5, fill: '#1d0d12', stroke: 'var(--bad)'}, grp);
      mk('text', {x: 9, y: 19, 'font-size': 10.5}, grp).textContent = `${n.label} (não está na resposta)`;
    } else {
      const f = n.f;
      const col = {entrada: 'var(--entrada)', inicial: 'var(--inicial)', regra: 'var(--regra)'}[f.origem] || 'var(--line2)';
      mk('rect', {width: p.w, height: p.h, rx: 6, fill: '#0d1621', stroke: col}, grp);
      mk('text', {x: 9, y: 17, 'font-size': 11.5, 'font-weight': 700}, grp).textContent = trunc(f.predicado, 22);
      mk('text', {x: p.w - 8, y: 17, 'font-size': 9.5, 'text-anchor': 'end', fill: col}, grp).textContent = `#${f.numero}${f.passo != null ? ' · ' + trunc(f.passo, 12) : ''}`;
      mk('text', {x: 9, y: 34, 'font-size': 10, fill: '#a9c1cc'}, grp).textContent = trunc((f.args || []).map(fmt).join(', '), 35) + (n.more ? '  ⋯' : '');
      title.textContent = `#${f.numero} ${fmtFact(f)}\norigem: ${f.origem}${f.passo != null ? ' · passo ' + f.passo : ''}${f.regra != null ? ' · regra R' + fmt(f.regra) : ''}`;
      grp.dataset.fact = f.numero;
    }
  }
  setupPanZoom(L);
}
function setupPanZoom(L) {
  const wrap = $('gwrap'), svg = $('gsvg');
  const apply = () => { svg.style.transform = `translate(${G.x}px,${G.y}px) scale(${G.zoom})`; };
  const fit = () => {
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    G.zoom = Math.min(1.2, Math.max(0.15, Math.min(ww / (L.width + 40), wh / (L.height + 40))));
    G.x = (ww - (L.width + 40) * G.zoom) / 2; G.y = Math.max(0, (wh - (L.height + 40) * G.zoom) / 2);
    apply();
  };
  // vista inicial: legivel, com a conclusao (a direita) visivel; "ajustar" mostra a prova toda
  const start = () => {
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    const fz = Math.min(ww / (L.width + 40), wh / (L.height + 40));
    if (fz >= 0.7) return fit();
    G.zoom = Math.min(0.85, Math.max(fz, 0.85));
    G.x = ww - (L.width + 40) * G.zoom;
    G.y = (wh - (L.height + 40) * G.zoom) / 2;
    apply();
  };
  start();
  const zoomAt = (f, cx, cy) => { const nz = Math.min(3, Math.max(0.1, G.zoom * f)); G.x = cx - (cx - G.x) * nz / G.zoom; G.y = cy - (cy - G.y) * nz / G.zoom; G.zoom = nz; apply(); };
  $('gZoomIn').onclick = () => zoomAt(1.25, wrap.clientWidth / 2, wrap.clientHeight / 2);
  $('gZoomOut').onclick = () => zoomAt(0.8, wrap.clientWidth / 2, wrap.clientHeight / 2);
  $('gFit').onclick = fit;
  wrap.addEventListener('wheel', e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
  let drag = null;
  wrap.addEventListener('pointerdown', e => { if (e.target.closest('.gnode')) return; drag = {x: e.clientX - G.x, y: e.clientY - G.y}; wrap.classList.add('drag'); wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e => { if (!drag) return; G.x = e.clientX - drag.x; G.y = e.clientY - drag.y; apply(); });
  wrap.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag'); });
  wrap.addEventListener('click', e => { const n = e.target.closest('.gnode'); if (n?.dataset.fact) selectFact(+n.dataset.fact, false); });
  wrap.addEventListener('dblclick', e => { const n = e.target.closest('.gnode'); if (n?.dataset.fact) { S.graphRoot = +n.dataset.fact; selectFact(+n.dataset.fact, false); renderPane(); } });
}

/* =====================================================================
   Painel de explicacao: "como?" a partir das premissas devolvidas pelo motor
   ===================================================================== */
function selectFact(num, graph = false) {
  S.selFact = num;
  if (graph) { S.graphRoot = num; S.tab = 'grafo'; renderTabs(); renderPane(); }
  else if (S.tab !== 'grafo') renderPane();
  else document.querySelectorAll('.gnode').forEach(g => g.classList.toggle('sel', g.dataset.fact == num && !g.querySelector('rect[rx="12"]')));
  renderDetail();
  if (window.matchMedia('(max-width:1180px)').matches) $('detail').classList.add('open');
}
function significados(idx, f) {
  const out = [];
  const seen = new Set();
  for (const a of atomsOf([f.predicado, f.args])) {
    if (idx.signif.has(a) && !seen.has(a)) { seen.add(a); out.push([a, idx.signif.get(a)]); }
  }
  return out;
}
function factLine(f, extra = '') {
  return `<span class="badge b-${esc(f.origem)}">${esc(f.origem)}${f.origem === 'regra' ? ' R' + esc(fmt(f.regra)) : ''}${f.passo != null ? ' · ' + esc(f.passo) : ''}</span>
    <span class="term">${esc(fmtFact(f))}</span>${extra}`;
}
function howNode(idx, num, shown) {
  const f = idx.byNum.get(num);
  if (!f) return `<div class="cond">#${num} (não está na resposta)</div>`;
  const leaf = f.origem !== 'regra' || !(f.premissas || []).length;
  if (shown.has(num) && !leaf) return `<details class="leaf"><summary>${factLine(f, ` <span class="ref">(prova acima)</span>`)}</summary></details>`;
  shown.add(num);
  return `<details class="${leaf ? 'leaf' : ''}" data-how="${num}"><summary>${factLine(f)} <button class="link small" data-fact="${num}" title="Explicar este facto">#${num}</button></summary></details>`;
}
function fillHow(det, idx, shown) {
  if (det.dataset.filled) return;
  det.dataset.filled = '1';
  const f = idx.byNum.get(+det.dataset.how);
  if (!f || f.origem !== 'regra') return;
  const html = (f.premissas || []).map(p => typeof p === 'number' ? howNode(idx, p, shown)
    : `<div class="cond">${p && p.f === 'nao' ? '¬ não existe ' + esc(fmt(p.args?.[0])) : '⚙ ' + esc(fmt(p))}</div>`).join('');
  det.insertAdjacentHTML('beforeend', html || '<div class="cond muted">sem premissas</div>');
}
function renderDetail() {
  const el = $('detail');
  const res = resAtual();
  if (!S.online || !res?.idx) { el.innerHTML = `<div class="sec-h">Explicação</div><div class="note">Corra uma inferência e selecione um ticket, uma pergunta ou um facto. A explicação é feita só com o que o motor devolve: a regra e as premissas de cada facto.</div>`; return; }
  const idx = res.idx;
  const f = S.selFact != null ? idx.byNum.get(S.selFact) : null;
  if (!f) { el.innerHTML = `<div class="sec-h">Explicação</div><div class="note">Selecione um ticket, uma pergunta ou um facto.</div>`; return; }
  const t = res.resposta.tickets.find(x => x.facto === f.numero);
  const q = res.resposta.perguntas.find(x => x.facto === f.numero);
  // factos sobre o mesmo incidente (o 1.o argumento igual ao incidente do ticket)
  const incKey = t ? keyOf(t.incidente) : (f.predicado === 'incidente' ? keyOf(f.args?.[0]) : null);
  const sobre = incKey ? res.resposta.factos.filter(x => x.numero !== f.numero && keyOf(x.args?.[0]) === incKey) : [];
  const usados = (idx.usedBy.get(f.numero) || []).map(n => idx.byNum.get(n)).filter(Boolean);
  const sig = significados(idx, f).concat(t?.fechado != null ? significados(idx, {predicado: '', args: [t.fechado]}) : []);
  el.innerHTML = `
    <div class="sec-h"><span>Explicação</span><span>
      <button class="btn ghost small" data-fact="${f.numero}" data-graph="1">ver grafo</button>
      <button class="icon-btn" id="closeDetail" style="padding:2px 7px">✕</button></span></div>
    <div class="scroll" style="flex:1">
      <div class="dhead">
        <div class="pred term">${esc(fmtFact(f))}</div>
        <span class="badge b-${esc(f.origem)}">${esc(f.origem)}</span>
        <div class="kv">
          <div>facto</div><div>#${f.numero}</div>
          <div>passo</div><div>${esc(f.passo ?? (f.origem === 'inicial' ? 'base de conhecimento' : 'concluído sobre os dados da base'))}</div>
          ${f.regra != null ? `<div>regra</div><div>R${esc(fmt(f.regra))} · ${(f.premissas || []).length} premissas</div>` : ''}
          ${t ? `<div>ticket</div><div>${esc(fmt(t.prioridade))} · ${esc(fmt(t.gravidade))} · ${t.fechado == null ? 'aberto' : 'fechado: ' + esc(fmt(t.fechado))}</div>
                 <div>ação</div><div class="term">${esc(fmt(t.acao))}</div>
                 <div>impactados</div><div class="term">${esc(fmt(t.impactados))}</div>` : ''}
          ${q ? `<div>pergunta</div><div>por responder · <button class="link" data-tab-go="perguntas">responder</button></div>` : ''}
        </div>
      </div>
      ${sig.map(([k, v]) => `<div class="signif"><b>${esc(k)}</b>${esc(fmt(v))}</div>`).join('')}
      <div class="dsec how" id="howBox">
        <h4>Como? · prova devolvida pelo motor</h4>
        ${f.origem === 'regra' ? '' : `<div class="muted small">${f.origem === 'entrada' ? 'Facto de entrada: chegou no passo ' + esc(f.passo ?? '—') + ' do pedido.' : 'Facto da base de conhecimento (dados fixos).'}</div>`}
      </div>
      ${sobre.length ? `<div class="dsec"><h4>Sobre este incidente (${sobre.length})</h4><div class="uses">${sobre.map(x => `<button data-fact="${x.numero}" class="term">${esc(trunc(fmtFact(x), 140))}</button>`).join('')}</div></div>` : ''}
      ${usados.length ? `<div class="dsec"><h4>Usado como premissa em (${usados.length})</h4><div class="uses">${usados.slice(0, 60).map(x => `<button data-fact="${x.numero}" class="term">R${esc(fmt(x.regra))} → ${esc(trunc(fmtFact(x), 130))}</button>`).join('')}</div></div>` : ''}
    </div>`;
  if (f.origem === 'regra') {
    const box = $('howBox');
    const shown = new Set([f.numero]);
    const top = document.createElement('div');
    top.innerHTML = `<details open data-how="${f.numero}" style="margin-left:0;border:none;padding-left:0"><summary>${factLine(f)}</summary></details>`;
    box.appendChild(top);
    const d = top.firstElementChild;
    fillHow(d, idx, shown);
    box.addEventListener('toggle', e => { if (e.target.matches('details[data-how]') && e.target.open) fillHow(e.target, idx, shown); }, true);
    // abrir automaticamente o primeiro nivel
    d.querySelectorAll(':scope > details[data-how]').forEach(x => { x.open = true; });
  }
}

/* =====================================================================
   Tudo
   ===================================================================== */
function renderAll() {
  renderHeader(); renderSide(); renderStatus(); renderTabs(); renderPane(); renderDetail();
  $('btnDetail').style.display = window.matchMedia('(max-width:1180px)').matches ? '' : 'none';
}

/* =====================================================================
   Eventos (delegados; nenhum valor do motor vai para codigo inline)
   ===================================================================== */
document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-fact], input[type=checkbox]');
  if (!b) return;
  if (b.closest('#eng') && b.dataset.eng) {
    if (b.dataset.eng === S.engine) return;
    S.engine = b.dataset.eng;
    S.view = S.engine === 'both' ? (S.view in (curRun()?.res || {}) ? S.view : readyEngines()[0]) : S.engine;
    if (S.engine === 'both') S.tab = 'comparar';
    renderAll();
    const run = curRun();
    const need = S.engine === 'both' ? readyEngines() : [S.engine];
    const falta = need.filter(m => !resValido(run?.res[m]));
    if (S.sel && run && falta.length) correr('troca de motor', falta);
    return;
  }
  if (b.dataset.view) { lembrarSelecao(); S.view = b.dataset.view; reconciliarSelecao(); renderAll(); return; }
  if (b.dataset.scen) {
    S.sel = {tipo: 'cenario', id: b.dataset.scen};
    S.filtro.passo = null; S.selFact = null; S.graphRoot = null;
    renderAll();
    const run = curRun();
    const need = S.engine === 'both' ? readyEngines() : [S.engine];
    const falta = need.filter(m => !resValido(run.res[m]));
    if (falta.length) correr('cenário ' + b.dataset.scen, falta);
    return;
  }
  if (b.id === 'btnCompleto') { S.sel = {tipo: 'completo'}; S.filtro.passo = null; S.selFact = null; S.graphRoot = null; renderAll(); correr('execução completa'); return; }
  if (b.dataset.grp) {
    const g = b.dataset.grp;
    S.grupos = b.checked ? [...new Set([...S.grupos, g])] : S.grupos.filter(x => x !== g);
    const ordem = Object.keys(S.cat.sequencias || {});
    S.grupos.sort((x, y) => ordem.indexOf(x) - ordem.indexOf(y));
    if (S.sel?.tipo === 'completo') { S.selFact = null; S.graphRoot = null; }
    renderAll();
    return;
  }
  if (b.id === 'btnRerun' || b.id === 'btnRetry') { correr('manual'); return; }
  if (b.id === 'btnConnect') { connect($('apiInput').value); return; }
  if (b.id === 'btnApi') {
    const v = prompt('Endereço da API (Spring Boot):', S.base || defaultBase());
    if (v) connect(v);
    return;
  }
  if (b.id === 'btnLog') { $('app').classList.toggle('log-open'); b.textContent = $('app').classList.contains('log-open') ? '▾ Registo' : '▴ Registo'; return; }
  if (b.id === 'btnDetail') { $('detail').classList.toggle('open'); return; }
  if (b.id === 'closeDetail') { if (window.matchMedia('(max-width:1180px)').matches) $('detail').classList.remove('open'); else { S.selFact = null; renderDetail(); if (S.tab !== 'grafo') renderPane(); } return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; renderTabs(); renderPane(); return; }
  if (b.dataset.tabGo) { S.tab = b.dataset.tabGo; renderTabs(); renderPane(); return; }
  if (b.dataset.passo) { S.filtro.passo = S.filtro.passo === b.dataset.passo ? null : b.dataset.passo; if (!['tickets', 'factos'].includes(S.tab)) S.tab = 'tickets'; renderPassos(resAtual()); renderTabs(); renderPane(); return; }
  if (b.id === 'clrPasso') { S.filtro.passo = null; renderPassos(resAtual()); renderPane(); return; }
  if (b.id === 'soFoco') { S.filtro.so = b.checked; renderPane(); return; }
  if (b.id === 'gHide') { G.hideInicial = b.checked; renderPane(); return; }
  if (b.id === 'moreFacts') { S.filtro.lim = (S.filtro.lim || 400) + 400; renderPane(); return; }
  if (b.parentElement?.dataset.filtro) { S.filtro[b.parentElement.dataset.filtro] = b.dataset.v; S.filtro.lim = 0; renderPane(); return; }
  if (b.dataset.q) { await responder(JSON.parse(b.dataset.q), JSON.parse(b.dataset.val)); return; }
  if (b.dataset.undo != null) { await desfazerResposta(+b.dataset.undo); return; }
  if (b.dataset.copy) {
    const x = curRun()?.res[b.dataset.m];
    const txt = JSON.stringify(b.dataset.copy === 'pedido' ? x.pedido : (x.resposta ?? x.corpoErro ?? null), null, 2);
    try { await navigator.clipboard.writeText(txt); toast('Copiado.', true); } catch { toast('O browser não deixou copiar.'); }
    return;
  }
  if (b.dataset.fact != null && !b.closest('.gwrap')) {
    if (b.tagName === 'BUTTON' && b.closest('summary')) e.preventDefault();
    selectFact(+b.dataset.fact, !!b.dataset.graph);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'catSearch') { S.filtro.cat = e.target.value; const pos = e.target.selectionStart; renderSide(); const s = $('catSearch'); s.focus(); s.setSelectionRange(pos, pos); }
  if (e.target.id === 'fTexto') { S.filtro.texto = e.target.value; clearTimeout(S._ft); S._ft = setTimeout(() => { const pos = e.target.selectionStart; renderPane(); const s = $('fTexto'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }, 200); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fPasso') { S.filtro.passo = e.target.value || null; renderPassos(resAtual()); renderPane(); }
  if (e.target.id === 'gDepth') { G.depth = +e.target.value; renderPane(); }
});
document.addEventListener('toggle', e => {
  const pre = e.target.querySelector?.(':scope > div > pre[data-lazy]');
  if (e.target.open && pre && !pre.textContent) {
    const x = curRun()?.res[pre.dataset.m];
    pre.textContent = JSON.stringify(pre.dataset.lazy === 'pedido' ? x.pedido : (x.resposta ?? x.corpoErro ?? null), null, 2);
  }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'apiInput') connect(e.target.value); });
window.addEventListener('resize', () => { $('btnDetail').style.display = window.matchMedia('(max-width:1180px)').matches ? '' : 'none'; });

$('favicon').href = $('logo').src;
renderAll();
connect();
</script>
