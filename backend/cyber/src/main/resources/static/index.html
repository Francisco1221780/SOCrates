<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberRangers · SOC</title>
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CyberRangers · Dashboard SOC
   Renderizador da API: tudo o que aparece vem de GET /api/health,
   GET /api/cenarios e POST /api/{motor}/infer. O UI nao tem cenarios,
   regras, tickets, grafos nem explicacoes escritos a mao.
   ===================================================================== */
:root{
  --bg:#070b11; --bg2:#0b1017; --panel:#0e1621; --panel2:#121c29; --panel3:#09111a;
  --line:#182839; --line2:#24394d; --line3:#30506a;
  --cyan:#22d3ee; --cyan2:#22d3ee1c; --cyan3:#22d3ee55;
  --indigo:#818cf8; --indigo2:#818cf81f;
  --txt:#e2eef3; --dim:#84a0ae; --dim2:#4f6a78;
  --entrada:#5eead4; --inicial:#94a3b8; --derivado:#38bdf8; --regra:#c084fc; --cond:#fbbf24;
  --perg:#fbbf24; --ticket:#fb7185; --acao:#f43f5e; --resp:#34d399;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --sev0:#64748b; --sev1:#facc15; --sev2:#fb923c; --sev3:#f43f5e;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --brand:'Chakra Petch','JetBrains Mono',monospace;
  --insp-w:430px; --log-h:170px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12.5px}
body{overflow:hidden}
button,select,input{font-family:var(--mono);font-size:12px;color:var(--txt)}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1f3344;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hgrow{flex:1;min-width:0}
.muted{color:var(--dim)} .small{font-size:11px} .term{font-family:var(--mono);word-break:break-word}

/* ======================= estrutura ======================= */
.app{position:fixed;inset:0;display:grid;grid-template-rows:56px minmax(0,1fr) auto 26px}
header{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,#0d1621,#080e15);min-width:0;position:relative;z-index:30}
.main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--insp-w);min-height:0}
.app.insp-closed .main{grid-template-columns:minmax(0,1fr) 0 0}
.app.insp-closed .insp,.app.insp-closed .vresize{display:none}

/* ======================= topo ======================= */
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{width:32px;height:32px;filter:drop-shadow(0 0 8px #22d3ee66)}
.brand b{font-family:var(--brand);font-size:18px;letter-spacing:1.5px;color:var(--cyan);text-shadow:0 0 12px #22d3ee66}
.brand b::after{content:'_';animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hbox{display:flex;align-items:center;gap:6px;background:#060b11;border:1px solid var(--line2);border-radius:8px;padding:3px 4px 3px 9px;flex-shrink:0;min-width:0}
.hbox>.lbl{font-size:9.5px;font-weight:800;color:var(--dim);letter-spacing:1px}
.seg{display:inline-flex;gap:3px}
.seg button{background:transparent;border:1px solid transparent;color:var(--dim);font-weight:700;padding:5px 10px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover:not(:disabled){color:#fff;background:#ffffff0d}
.seg button.on{color:#fff;border-color:var(--line3);background:var(--panel2)}
#eng button.on[data-eng=prolog]{color:#fff;border-color:var(--cyan);background:var(--cyan2);box-shadow:0 0 14px #22d3ee44,inset 0 0 8px #22d3ee22}
#eng button.on[data-eng=drools]{color:#fff;border-color:var(--indigo);background:var(--indigo2);box-shadow:0 0 14px #818cf844}
#eng button.on[data-eng=both]{color:#fff;border-color:var(--warn);background:#fbbf241a;box-shadow:0 0 14px #fbbf2444}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim2);flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)} .dot.wait{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.scen-btn{background:transparent;border:none;color:#fff;font-weight:700;padding:5px 8px;border-radius:5px;display:flex;align-items:center;gap:8px;max-width:360px;min-width:0}
.scen-btn:hover:not(:disabled){background:#ffffff0d}
.scen-btn .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scen-btn code{color:var(--cyan)}
.globalbtn{background:var(--cyan2);border:1px solid var(--cyan3);color:var(--cyan);font-weight:800;border-radius:6px;padding:5px 10px;white-space:nowrap}
.globalbtn:hover{background:#22d3ee33;color:#fff}
.views{display:inline-flex;background:#060b11;border:1px solid var(--line2);border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
.views button{background:transparent;border:none;color:var(--dim);font-weight:700;padding:6px 11px;border-radius:5px;white-space:nowrap}
.views button:hover:not(:disabled){color:#fff}
.views button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line3)}
.views .cnt{margin-left:5px;padding:0 6px;border-radius:9px;background:var(--line2);font-size:10px}
.inspbtn{background:var(--cyan);color:#03141b;border:none;font-weight:800;border-radius:6px;padding:7px 12px;white-space:nowrap}
.inspbtn.off{background:transparent;color:var(--cyan);border:1px solid var(--cyan3)}
.icon-btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;color:var(--dim)}
.icon-btn:hover:not(:disabled){color:#fff;border-color:var(--cyan3)}

/* menu de cenarios */
.menu{position:absolute;top:50px;z-index:60;width:540px;max-height:min(700px,calc(100vh - 80px));display:none;flex-direction:column;background:#0b131d;border:1px solid var(--line3);border-radius:10px;box-shadow:0 24px 60px #000c,0 0 0 1px #22d3ee14}
.menu.open{display:flex}
.menu .mh{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.menu .global{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--cyan3);border-radius:8px;background:linear-gradient(135deg,#22d3ee12,transparent)}
.menu .global.on{box-shadow:0 0 0 1px var(--cyan) inset}
.menu .grps{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:11.5px;background:var(--panel3);cursor:pointer}
.chk input{accent-color:var(--cyan);margin:0}
.chk .n{color:var(--dim)}
.btn{background:var(--cyan);color:#04131a;border:none;border-radius:6px;padding:7px 12px;font-weight:800}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2);font-weight:700}
.btn.ghost:hover:not(:disabled){border-color:var(--cyan3)}
.btn.small{padding:4px 9px;font-size:11px}
.search{width:100%;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;margin-top:8px}
.search:focus,.inp:focus{outline:none;border-color:var(--cyan3)}
.mlist{overflow:auto;padding:4px 0 8px}
.mgrp{padding:8px 14px 3px;font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:1px}
.mi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:none;border-left:2px solid transparent;padding:6px 14px;color:var(--txt)}
.mi:hover{background:#ffffff08}
.mi.on{background:var(--cyan2);border-left-color:var(--cyan)}
.mi code{color:var(--cyan);font-weight:800;min-width:48px}
.mi span{color:#c7d6dd;font-size:11.5px;line-height:1.35}
.mi small{display:block;color:var(--dim2);font-size:10px;margin-top:1px}
.mnote{margin:6px 14px 10px;color:var(--dim);font-size:10.5px;line-height:1.5}

/* ======================= centro ======================= */
.center{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#0f2233 0%,transparent 55%),var(--bg)}
.pane{flex:1;min-height:0;overflow:auto;padding:14px 16px}
.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;background:radial-gradient(circle at 1px 1px,#1b2d3d55 1px,transparent 0) 0 0/22px 22px;touch-action:none}
.canvas.drag{cursor:grabbing}
.canvas svg{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}

/* notch */
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:10px;padding:7px 12px;background:#05090ef2;border:1px solid var(--line2);border-radius:16px;box-shadow:0 12px 34px #000b,0 0 0 1px #000;white-space:nowrap;max-width:calc(100% - 24px)}
.notch.static{position:static;transform:none;margin:10px auto 0;width:max-content}
.notch .ctl{display:flex;align-items:center;gap:3px;background:#0b141e;border:1px solid var(--line);border-radius:10px;padding:2px}
.notch .ctl button{background:transparent;border:none;color:var(--dim);width:28px;height:26px;border-radius:7px;font-size:12px}
.notch .ctl button:hover:not(:disabled){color:#fff;background:#ffffff10}
.notch .ctl button.play{background:var(--ok);color:#03140d;width:34px;height:30px;border-radius:50%;box-shadow:0 0 16px #34d39977;font-size:13px}
.notch .ctl button.play.pause{background:var(--warn);box-shadow:0 0 16px #fbbf2477}
.notch .pos{display:flex;flex-direction:column;line-height:1.25;min-width:140px}
.notch .pos b{font-size:12px}
.notch .pos span{font-size:10px;color:var(--dim);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.notch input[type=range]{width:130px;accent-color:var(--cyan)}
@media (max-width:1500px){.notch input[type=range]{display:none}}
.notch .spd{background:#0b141e;border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:var(--cyan);font-weight:800}
.qbadge{display:inline-flex;align-items:center;gap:6px;background:#fbbf241f;border:1px solid #fbbf2488;color:#fde68a;border-radius:9px;padding:5px 10px;font-weight:800;animation:qpulse 1.6s ease-in-out infinite}
.qbadge:hover{background:#fbbf2433;color:#fff}
@keyframes qpulse{50%{box-shadow:0 0 18px #fbbf2466}}
.estado{padding:3px 9px;border-radius:6px;font-weight:800;font-size:10.5px;border:1px solid;letter-spacing:.3px}
.estado.concluido{color:var(--ok);border-color:#34d39966;background:#34d3991a}
.estado.aguarda_resposta{color:var(--warn);border-color:#fbbf2466;background:#fbbf241a}
.estado.erro{color:var(--bad);border-color:#fb718566;background:#fb71851a}
.estado.idle{color:var(--dim);border-color:var(--line2)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #ffffff33;border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* controlos do canvas */
.zoombar{position:absolute;right:12px;bottom:12px;z-index:12;display:flex;align-items:center;gap:4px;background:#05090ee8;border:1px solid var(--line2);border-radius:9px;padding:4px}
.zoombar button{background:transparent;border:none;color:var(--dim);padding:4px 8px;border-radius:5px;font-weight:800}
.zoombar button:hover{color:#fff;background:#ffffff10}
.zoombar b{color:var(--cyan);min-width:44px;text-align:center;font-size:11.5px}
.legend{position:absolute;left:12px;bottom:12px;z-index:12;display:flex;gap:6px 11px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 200px);background:#05090ed9;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:10px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
.mapopts{position:absolute;left:12px;bottom:52px;z-index:11;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 200px)}
.chip{display:inline-flex;align-items:center;gap:7px;background:#05090ee8;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:11px;color:#c7d6dd}
.chip b{color:#fff}
.chip.focus{border-color:var(--cyan3);color:var(--cyan)}
.chip input{accent-color:var(--cyan);margin:0}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--cyan3);color:#fff}
.prooftitle{position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:11;max-width:calc(100% - 40px);display:flex;align-items:center;gap:8px;background:#05090ee8;border:1px solid var(--line2);border-radius:10px;padding:7px 12px;font-size:12px}

/* SVG: fases */
.phase rect.bg{fill:#0c151fcc;stroke:#1b2c3c;stroke-width:1}
.phase text.ph1{font:700 9.5px var(--mono);fill:#5f8193;letter-spacing:1px}
.phase text.ph2{font:800 10.5px var(--mono);fill:#cfe6ee;letter-spacing:.6px}
.phase text.ph3{font:400 9.5px var(--mono);fill:#5f8193}
/* SVG: nos */
.n{cursor:pointer}
.n rect.box{fill:#0b1520;stroke-width:1.3;transition:opacity .25s,stroke-width .2s}
.n text{font-family:var(--mono);pointer-events:none}
.n .t1{font-size:11.5px;font-weight:800;fill:#eaf6fb}
.n .t2{font-size:9.8px;fill:#9fbccb}
.n .t3{font-size:9.3px;fill:#6b8a99}
.n .cnt{font-size:10px;font-weight:800}
.n.k-entrada rect.box{stroke:var(--entrada);stroke-dasharray:5 3}
.n.k-inicial rect.box{stroke:var(--inicial);stroke-dasharray:2 3}
.n.k-derivado rect.box{stroke:var(--derivado)}
.n.k-perg rect.box{stroke:var(--perg)}
.n.k-ticket rect.box{stroke:var(--ticket)}
.n.k-acao rect.box{stroke:var(--acao);fill:#1a0a10}
.n.k-resp rect.box{stroke:var(--resp)}
.n.k-rule rect.box{stroke:var(--regra);fill:#170e22}
.n.k-cond rect.box{stroke:var(--cond);stroke-dasharray:4 3;fill:#161106}
.n.on.k-entrada rect.box{filter:drop-shadow(0 0 5px #5eead466)}
.n.on.k-derivado rect.box{filter:drop-shadow(0 0 7px #38bdf888)}
.n.on.k-perg rect.box{filter:drop-shadow(0 0 9px #fbbf24aa);animation:glowA 1.8s ease-in-out infinite}
.n.on.k-ticket rect.box{filter:drop-shadow(0 0 8px #fb718599)}
.n.on.k-acao rect.box{filter:drop-shadow(0 0 10px #f43f5eaa)}
.n.on.k-resp rect.box{filter:drop-shadow(0 0 8px #34d39999)}
.n.on.k-rule rect.box{filter:drop-shadow(0 0 7px #c084fc88)}
@keyframes glowA{50%{filter:drop-shadow(0 0 16px #fbbf24)}}
.n.off{opacity:.16}
.n.ctx{opacity:.38}
.n.ctx.on rect.box{filter:none}
.n.fresh rect.box{animation:fresh 1.1s ease-out}
@keyframes fresh{0%{filter:drop-shadow(0 0 0 #fff)}25%{filter:drop-shadow(0 0 22px #ffffff)}100%{}}
.n.sel rect.box{stroke:#fff!important;stroke-width:2.4;stroke-dasharray:none!important}
.n:hover rect.box{stroke-width:2.2}
svg.dimmed .n:not(.hl){opacity:.12}
svg.dimmed .e:not(.hl){opacity:.04}
.intro .n{animation:introN .55s both}
@keyframes introN{from{opacity:0}to{opacity:1}}
/* SVG: arestas */
.e{fill:none;stroke:#2a4357;stroke-width:1.15;opacity:.55;transition:opacity .25s}
.e.on{stroke:#2f6d86;opacity:.75}
.e.off{opacity:.05}
.e.hl{stroke:#7dd3fc;stroke-width:1.8;opacity:1;stroke-dasharray:6 6;animation:flow .9s linear infinite}
.e.hl.to-acao{stroke:#fb7185}
.e.hl.to-perg{stroke:#fbbf24}
.e.flow{stroke:#38bdf8;stroke-dasharray:6 6;animation:flow 1s linear infinite;opacity:.95}
.e.neg{stroke:#a16207}
@keyframes flow{to{stroke-dashoffset:-24}}
.epill rect{fill:#1a1030;stroke:#c084fc;stroke-width:1}
.epill text{font:800 9px var(--mono);fill:#e9d5ff}

/* tabelas e paineis */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;color:var(--dim);height:100%;padding:30px;line-height:1.6}
.empty .big{font-size:34px}
.empty h2{margin:0;color:var(--txt);font-family:var(--brand);font-size:20px;letter-spacing:.5px}
.inp{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;min-width:280px}
.errbox{border:1px solid #fb718577;background:#fb71851a;color:#fecdd3;border-radius:9px;padding:12px 14px;line-height:1.5}
.errbox b{color:#fff}
.infobox{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:10px 12px;margin-bottom:12px;color:#c7d6dd;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:6px 9px}
.sg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.sg button{background:transparent;border:none;padding:6px 11px;color:var(--dim);font-weight:700}
.sg button.on{background:var(--cyan2);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
.t th{position:sticky;top:-14px;background:var(--bg);text-align:left;color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;padding:8px;border-bottom:1px solid var(--line2);z-index:1}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#ffffff06}
.t tr.sel td{background:var(--cyan2)}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:800;font-size:10.5px;border:1px solid;white-space:nowrap}
.b-entrada{color:var(--entrada);border-color:#5eead466}
.b-inicial{color:var(--inicial);border-color:#94a3b866}
.b-regra{color:var(--regra);border-color:#c084fc66}
.b-closed{color:var(--dim);border-color:var(--line2)}
.b-open{color:var(--ok);border-color:#34d39966}
.b-focus{color:var(--cyan);border-color:var(--cyan3)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel3);min-width:80px}
.kpi b{font-size:18px} .kpi span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
pre.json{background:#05090e;border:1px solid var(--line2);border-radius:8px;padding:10px;font-size:11px;line-height:1.45;color:#b7e4f0;overflow:auto;max-height:62vh;white-space:pre}
details.box{border:1px solid var(--line2);border-radius:9px;background:var(--panel2);margin-bottom:10px}
details.box>summary{cursor:pointer;padding:9px 12px;font-weight:700}
details.box>div{padding:0 12px 12px}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.cmpcard{border:1px solid var(--line2);border-radius:9px;background:var(--panel2);padding:10px 12px}
.cmpcard h4{margin:0 0 6px;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.verdict{border-radius:9px;padding:11px 14px;margin-bottom:12px;font-weight:800}
.verdict.ok{background:#34d3991a;border:1px solid #34d39966;color:#a7f3d0}
.verdict.diff{background:#fb71851a;border:1px solid #fb718566;color:#fecdd3}

/* ======================= inspetor ======================= */
.vresize{cursor:col-resize;background:linear-gradient(90deg,transparent 2px,var(--line2) 2px,var(--line2) 3px,transparent 3px);touch-action:none}
.vresize:hover,.vresize.drag{background:linear-gradient(90deg,transparent 1px,var(--cyan) 1px,var(--cyan) 4px,transparent 4px)}
.insp{background:var(--bg2);min-height:0;display:flex;flex-direction:column;min-width:0}
.ih{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2);background:#0b131c}
.ih .soc{font:800 10px var(--mono);color:var(--cyan);border:1px solid var(--cyan3);border-radius:4px;padding:2px 6px;letter-spacing:1px}
.ih h2{margin:0;font-family:var(--brand);font-size:15px;letter-spacing:.5px;white-space:nowrap}
.ib{flex:1;overflow:auto;min-height:0;padding:12px}
.crumb{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11px;color:var(--dim)}
.crumb button{background:none;border:none;color:var(--cyan);padding:0;font-size:11px}
.card{border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:12px;margin-bottom:12px}
.card .ct{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
.card.amber{border-color:#fbbf2466;background:linear-gradient(180deg,#191306,#0f0c05)}
.card.amber .ct{color:var(--warn)}
.card.red .ct{color:var(--ticket)}
.qt{font-size:12.5px;line-height:1.5;color:#fff7e0;margin:6px 0 9px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
.qmeta b{color:#fff}
.qopts{display:flex;flex-direction:column;gap:5px}
.qopt{background:#fbbf2412;border:1px solid #fbbf2455;color:#fde68a;border-radius:7px;padding:7px 10px;text-align:left;line-height:1.35}
.qopt:hover:not(:disabled){background:#fbbf242e;color:#fff;border-color:var(--warn)}
.qsep{border-top:1px dashed #fbbf2433;margin:12px 0}
.ans{display:flex;align-items:center;gap:8px;border:1px solid #34d39955;background:#34d3990f;border-radius:7px;padding:6px 9px;margin-bottom:6px;font-size:11px}
.trow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel3);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:5px}
.trow:hover{border-color:var(--cyan3)}
.trow.sel{border-color:var(--cyan);background:var(--cyan2)}
.trow .ta{flex:1;min-width:0}
.trow .ta b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ta span{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sevrow{display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px;border-bottom:1px dashed var(--line)}
.dpred{font-size:14px;font-weight:800;line-height:1.4;word-break:break-word;margin-bottom:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 8px;font-size:11.5px}
.kv div:nth-child(odd){color:var(--dim)}
.signif{margin:10px 0 0;padding:9px 11px;border-left:3px solid var(--cyan);background:#0a2130;border-radius:0 7px 7px 0;font-size:11.5px;line-height:1.5;color:#d6f4fb}
.signif b{display:block;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--cyan);margin-bottom:3px}
.ctx{display:grid;gap:8px}
.ctxi{border-left:3px solid;border-radius:0 7px 7px 0;background:var(--panel3);padding:7px 10px;font-size:11px;line-height:1.5}
.ctxi .h{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
.how details{margin-left:12px;border-left:1px dashed var(--line2);padding-left:8px}
.how summary{list-style:none;cursor:pointer;padding:3px 0;display:flex;gap:6px;align-items:flex-start;font-size:11.5px;line-height:1.4}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:'▸';color:var(--dim);width:10px;flex-shrink:0}
.how details[open]>summary::before{content:'▾'}
.how details.leaf>summary::before{content:'•'}
.how .cond{margin-left:22px;padding:3px 0;font-size:11.5px;color:#fde68a}
.how .ref{color:var(--dim);font-size:10.5px}
.link{background:none;border:none;color:var(--cyan);padding:0;text-decoration:underline dotted;font-size:inherit;text-align:left}
.uses{display:flex;flex-direction:column;gap:4px}
.uses button{text-align:left;background:var(--panel3);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.35}
.uses button:hover{border-color:var(--cyan3)}

/* consola e rodape */
.logwrap{border-top:1px solid var(--line2);background:#060a0f;display:grid;grid-template-rows:28px minmax(0,1fr)}
.app.log-open .logwrap{height:var(--log-h)}
.logbar{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:11px;color:var(--dim)}
.logbar button.tg{background:none;border:none;color:var(--cyan);font-weight:800;padding:0}
.logbar .last{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app:not(.log-open) .log{display:none}
.log{overflow:auto;padding:4px 14px;font-size:11.5px}
.log div{display:grid;grid-template-columns:72px 170px 1fr;gap:10px;padding:2px 0}
.log .t{color:var(--dim2)} .log .k{font-weight:800}
.log .ok .k{color:var(--ok)} .log .bad .k{color:var(--bad)} .log .info .k{color:var(--cyan)} .log .rule .k{color:var(--regra)} .log .act .k{color:var(--ticket)} .log .q .k{color:var(--warn)}
footer{display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line2);background:#060a0f;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
footer .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #34d39955;color:var(--ok);border-radius:5px;padding:1px 8px;font-weight:800}
footer .pill.bad{border-color:#fb718555;color:var(--bad)}
footer b{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;max-width:560px;background:#1d0d12;border:1px solid #fb718588;color:#fecdd3;border-radius:9px;padding:10px 14px;line-height:1.45;box-shadow:0 10px 30px #000a;z-index:80;display:none}
.toast.ok{background:#0b1d16;border-color:#34d39988;color:#bbf7d0}
.toast.show{display:block}

#scenBox{flex-shrink:1}
@media (max-width:1720px){ .brand b{display:none} }
@media (max-width:1400px){ .hbox>.lbl{display:none} .views button{padding:6px 7px} .globalbtn{padding:5px 7px} }
@media (max-width:1050px){
  .main{grid-template-columns:minmax(0,1fr) 0 0}
  .insp{position:fixed;right:0;top:56px;bottom:26px;width:min(var(--insp-w),94vw);z-index:40;box-shadow:-12px 0 40px #000b}
  .vresize{display:none}
  .mapopts{max-width:calc(100% - 24px);top:64px}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Estado
   ===================================================================== */
const S = {
  base: '', online: false, health: null, cat: null, byId: new Map(),
  engine: 'prolog', view: 'prolog',
  sel: null,                 // {tipo:'completo'} | {tipo:'cenario', id}
  grupos: [],                // sequencias escolhidas para a vista global
  runs: new Map(),           // chave -> {respostas:[], res:{motor: resultado}}
  tab: 'mapa',               // mapa | prova | tickets | factos | comparar | api
  insp: {open: true, nav: [{t: 'fila'}]},   // pilha do inspetor: fila | fact | pred | acao
  rootKey: null,             // raiz da prova (pelo conteudo do facto)
  filtro: {tickets: 'abertos', ambito: 'foco', origem: 'regra', texto: '', passo: null, cat: '', lim: 0},
  map: {showBase: false, pos: null, playing: false, speed: 1},
  busy: 0, reqSeq: 0, intro: false,
};
const ENGINES = ['prolog', 'drools'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {get(k, d) { try { const v = localStorage.getItem('cr-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
            set(k, v) { try { localStorage.setItem('cr-' + k, JSON.stringify(v)); } catch {} }};

/* =====================================================================
   Termos JSON do contrato
   ===================================================================== */
function fmt(t) {
  if (t === null || t === undefined) return 'null';
  if (Array.isArray(t)) return '[' + t.map(fmt).join(', ') + ']';
  if (typeof t === 'object' && 'f' in t) return t.f + '(' + (t.args || []).map(fmt).join(', ') + ')';
  if (typeof t === 'object') return JSON.stringify(t);
  return String(t);
}
const fmtFact = f => f.predicado + '(' + (f.args || []).map(fmt).join(', ') + ')';
const keyOf = t => JSON.stringify(t);
const factKey = f => f ? f.predicado + keyOf(f.args) : null;
const functor = t => (t && typeof t === 'object' && !Array.isArray(t) && t.f) ? t.f : fmt(t);
const trunc = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const human = s => String(s).replace(/_/g, ' ');
function atomsOf(t, out = new Set()) {
  if (Array.isArray(t)) t.forEach(x => atomsOf(x, out));
  else if (t && typeof t === 'object') { if (t.f) out.add(t.f); (t.args || []).forEach(x => atomsOf(x, out)); }
  else if (typeof t === 'string') out.add(t);
  return out;
}
function median(a) { const s = [...a].sort((x, y) => x - y); return s[Math.floor((s.length - 1) / 2)]; }
function countUpTo(sorted, k) { let lo = 0, hi = sorted.length; while (lo < hi) { const m = (lo + hi) >> 1; if (sorted[m] <= k) lo = m + 1; else hi = m; } return lo; }
const push = (map, k, v) => { if (!map.has(k)) map.set(k, []); map.get(k).push(v); };

/* =====================================================================
   Rede
   ===================================================================== */
async function api(path, opts = {}, timeoutMs = 120000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = performance.now();
  try {
    const res = await fetch(S.base + path, {...opts, signal: ctrl.signal});
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = null; }
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) return {ok: false, status: res.status, data, ms, erro: (data && data.erro) || txt.slice(0, 300) || res.statusText};

/* =====================================================================
   Passos (sempre do catalogo da API)
   ===================================================================== */
function idsCompleto() {
  const seqs = S.cat.sequencias || {};
  const out = [], seen = new Set();
  Object.keys(seqs).filter(g => S.grupos.includes(g)).forEach(g => seqs[g].forEach(id => { if (!seen.has(id)) { seen.add(id); out.push(id); } }));
  return out;
}
function idsCadeia(id) {

  const visit = (x, stack) => {
    if (seen.has(x)) return;
    if (stack.has(x)) throw new Error('dependência circular em ' + x);
    const c = S.byId.get(x);
    if (!c) throw new Error('o catálogo não tem o cenário ' + x);
    stack.add(x);
    (c.depende || []).forEach(d => visit(d, stack));
    stack.delete(x);
    seen.add(x); out.push(x);

}
const idsBase = () => !S.sel || !S.cat ? [] : S.sel.tipo === 'completo' ? idsCompleto() : idsCadeia(S.sel.id);

}

/* =====================================================================

async function correr(motivo = '', only = null) {

  let passos;

  const run = curRun();
  const sig = sigOf(passos);
  const engines = only || (S.engine === 'both' ? readyEngines() : [S.engine]);
  if (!engines.length) { toast('Nenhum motor está pronto (ver /api/health).'); return; }
  const pedido = {versaoKB: S.cat.versaoKB, passos};
  const seq = ++S.reqSeq;
  lembrarSelecao();
  S.busy++; S.map.playing = false;
  renderNotch(); renderFooter();
  if (!okRes()) { renderCenter(); renderInsp(); }
  await Promise.all(engines.map(async m => {
    log('inferência', `POST /api/${m}/infer · ${passos.length} passos${motivo ? ' · ' + motivo : ''}`, 'info');
    const r = await api(`/api/${m}/infer`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(pedido)});
    const res = {sig, pedido, ms: r.ms, status: r.status, at: new Date()};
    if (r.ok && r.data.estado !== 'erro') {
      res.resposta = r.data;
      res.idx = indexar(r.data, passos);
      log(`HTTP ${r.status} · ${m}`, `${r.ms} ms · ${r.data.estado} · ${r.data.tickets?.length ?? 0} tickets · ${r.data.perguntas?.length ?? 0} perguntas · ${r.data.factos?.length ?? 0} factos`, 'ok');
    } else {
      res.erro = r.erro || r.data?.erro || 'erro desconhecido';
      res.corpoErro = r.data;
      log(`HTTP ${r.status || '—'} · ${m}`, `${HTTP_TXT[r.status] || 'erro'}: ${res.erro}`, 'bad');
      toast(`${m}: ${HTTP_TXT[r.status] || 'erro'}: ${res.erro}`);
    }
    run.res[m] = res;
  }));
  S.busy--;
  const atual = runKey() === runKeyAt(run) && seq === S.reqSeq;
  if (atual) {
    if (S.engine !== 'both') S.view = S.engine;

/* ----- pan & zoom ----- */
const VIEW = {};
function setupPanZoom(wrap, svg, L, kind, focus) {
  const vk = kind === 'prova' ? 'prova:' + S.rootKey + G.depth + G.hideInicial : 'mapa:' + runKey() + S.view + S.map.showBase;
  const st = VIEW[vk] ||= {};
  const W = L.width + 60, H = L.height + 40;
  const TOP = kind === 'prova' ? 104 : 62, BOT = 52;
  const apply = () => { svg.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.z})`; const zl = $('zlbl'); if (zl) zl.textContent = Math.round(st.z * 100) + '%'; };
  const fit = () => {
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    st.z = Math.min(1.1, Math.max(0.1, Math.min((ww - 40) / W, (wh - TOP - BOT - (kind === 'mapa' ? 40 : 0)) / H)));
    st.x = (ww - W * st.z) / 2 + 20 * st.z;
    st.y = TOP + Math.max(0, (wh - TOP - BOT - H * st.z) / 2);
    apply();
  };
  const readable = () => {
    // tudo, se couber legivel; senao legivel e centrado na conclusao (o no em foco)
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    const fz = Math.min((ww - 40) / W, (wh - TOP - BOT) / H);
    if (fz >= 0.72) return fit();
    st.z = 0.78;
    const fx = focus ? focus.x + focus.w : W, fy = focus ? focus.y + focus.h / 2 : H / 2;
    st.x = W * st.z <= ww - 40 ? (ww - W * st.z) / 2 : Math.min(20, ww - 40 - fx * st.z);
    st.y = TOP + (wh - TOP - BOT) / 2 - fy * st.z;
    apply();
  };
  st.fit = fit;
  if (st.z == null) (kind === 'mapa' ? fit : readable)(); else apply();
  const zoomAt = (f, cx, cy) => { const nz = Math.min(3, Math.max(0.08, st.z * f)); st.x = cx - (cx - st.x) * nz / st.z; st.y = cy - (cy - st.y) * nz / st.z; st.z = nz; apply(); };
  wrap.parentElement.querySelectorAll('[data-z]').forEach(b => b.onclick = () => b.dataset.z === 'fit' ? fit() : zoomAt(b.dataset.z === 'in' ? 1.2 : 0.83, wrap.clientWidth / 2, wrap.clientHeight / 2));
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey || (!e.shiftKey && Math.abs(e.deltaY) >= Math.abs(e.deltaX) && e.deltaMode === 0 && Math.abs(e.deltaY) > 40)) zoomAt(e.deltaY < 0 ? 1.1 : 0.91, e.clientX - r.left, e.clientY - r.top);
    else { st.x -= e.shiftKey ? e.deltaY : e.deltaX; st.y -= e.shiftKey ? 0 : e.deltaY; apply(); }
  }, {passive: false});
  let drag = null, moved = false;
  wrap.addEventListener('pointerdown', e => { if (e.button !== 0) return; drag = {x: e.clientX - st.x, y: e.clientY - st.y, sx: e.clientX, sy: e.clientY}; moved = false; });
  wrap.addEventListener('pointermove', e => {
    if (drag) {
      if (!moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      if (!moved) { moved = true; wrap.classList.add('drag'); wrap.setPointerCapture(e.pointerId); }
      st.x = e.clientX - drag.x; st.y = e.clientY - drag.y; apply(); return;
    }
    if (kind === 'mapa') { const n = e.target.closest('.n'); highlight(n?.dataset.n || pinnedId()); }
  });
  wrap.addEventListener('pointerleave', () => { if (kind === 'mapa' && !drag) highlight(pinnedId()); });
  wrap.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag'); });
  wrap.addEventListener('click', e => {
    if (moved) { moved = false; return; }
    const n = e.target.closest('.n');
    if (kind === 'mapa') {
      if (!n) { if (S.insp.nav.length > 1) { S.insp.nav = [{t: 'fila'}]; renderInsp(); } highlight(null); return; }
      const id = n.dataset.n;
      inspPush(id.startsWith('a:') ? {t: 'acao', key: id} : {t: 'pred', key: id});
    } else if (n?.dataset.fact) selectFact(+n.dataset.fact);
  });
  wrap.addEventListener('dblclick', e => {
    const n = e.target.closest('.n');
    if (!n) return;
    const r = okRes();
    if (kind === 'mapa') {
      const node = CUR.M.byId.get(n.dataset.n);
      const best = node.kind === 'acao'
        ? [...node.tickets].sort((a, b) => (a.fechado == null ? 0 : 1) - (b.fechado == null ? 0 : 1) || rankNum(r.idx, 'prio', a.prioridade) - rankNum(r.idx, 'prio', b.prioridade))[0]?.facto
        : node.insts.at(-1);
      if (best != null) openProof(best);
    } else if (n.dataset.fact) openProof(+n.dataset.fact);
  });
}

function factLine(f, extra = '') {
  return `<span class="badge b-${esc(f.origem)}">${esc(f.origem === 'regra' ? 'R' + fmt(f.regra) : f.origem)}${f.passo != null ? ' · ' + esc(f.passo) : ''}</span><span class="term">${esc(fmtFact(f))}</span>${extra}`;
}
function howNode(idx, num, shown) {
  const f = idx.byNum.get(num);
  if (!f) return `<div class="cond">#${num} (não está na resposta)</div>`;
  const leaf = f.origem !== 'regra' || !(f.premissas || []).length;
  if (shown.has(num) && !leaf) return `<details class="leaf"><summary>${factLine(f, ' <span class="ref">(prova acima)</span>')}</summary></details>`;
  shown.add(num);
  return `<details class="${leaf ? 'leaf' : ''}" data-how="${num}"><summary>${factLine(f)} <button class="link small" data-fact="${num}">#${num}</button></summary></details>`;
}
function fillHow(det, idx, shown) {
  if (det.dataset.filled) return;
  det.dataset.filled = '1';
  const f = idx.byNum.get(+det.dataset.how);
  if (!f || f.origem !== 'regra') return;
  det.insertAdjacentHTML('beforeend', (f.premissas || []).map(p => typeof p === 'number' ? howNode(idx, p, shown)
    : `<div class="cond">${p && p.f === 'nao' ? '¬ não existe ' + esc(fmt(p.args?.[0])) : '⚙ ' + esc(fmt(p))}</div>`).join('') || '<div class="cond muted">sem premissas</div>');
}
function mountHow(res, num) {
  const f = res.idx.byNum.get(num);
  if (!f || f.origem !== 'regra') return;
  const box = $('howBox');
  const shown = new Set([num]);
  const top = document.createElement('div');
  top.innerHTML = `<details open data-how="${num}" style="margin-left:0;border:none;padding-left:0"><summary>${factLine(f)}</summary></details>`;
  box.appendChild(top);
  const d = top.firstElementChild;
  fillHow(d, res.idx, shown);
  box.addEventListener('toggle', e => { if (e.target.matches('details[data-how]') && e.target.open) fillHow(e.target, res.idx, shown); }, true);
  d.querySelectorAll(':scope > details[data-how]').forEach(x => { x.open = true; });
}

function renderComparar(center) {
  const run = curRun();
  const [a, b] = ENGINES.map(m => run?.res[m]);
  let html;
  if (!a || !b) html = `<div class="empty"><div>${S.busy ? '<span class="spin"></span> a inferir nos dois motores…' : 'Corra a inferência com os dois motores.'}</div></div>`;

    const A = a.resposta, B = b.resposta;
    const conj = (lst, kf) => { const m = new Map(); lst.forEach(x => m.set(kf(x), x)); return m; };
    const kF = f => f.predicado + keyOf(f.args);
    const sets = [
      ['Tickets', A.tickets, B.tickets, t => keyOf([t.incidente, t.ativo, t.acao, t.gravidade, t.prioridade, t.impactados, t.fechado]), t => `${fmt(t.prioridade)} · ${fmt(t.ativo)} · ${fmt(t.acao)} · ${fmt(t.incidente)}${t.fechado != null ? ' · fechado: ' + fmt(t.fechado) : ''}`],
      ['Perguntas', A.perguntas, B.perguntas, q => keyOf([q.ativo, q.evento, q.pergunta]), q => `${fmt(q.pergunta)} · ${fmt(q.ativo)} · ${fmt(q.evento)}`],

      ['Factos de entrada', A.factos.filter(f => f.origem === 'entrada'), B.factos.filter(f => f.origem === 'entrada'), kF, fmtFact],
    ].map(([nome, la, lb, kf, show]) => {
      const ma = conj(la, kf), mb = conj(lb, kf);
      return {nome, na: ma.size, nb: mb.size, soA: [...ma.keys()].filter(k => !mb.has(k)).map(k => show(ma.get(k))), soB: [...mb.keys()].filter(k => !ma.has(k)).map(k => show(mb.get(k)))};

      <div class="cmpgrid">${sets.map(s => `<div class="cmpcard"><h4>${esc(s.nome)}</h4><div>${ENGINES[0]}: <b>${s.na}</b> · ${ENGINES[1]}: <b>${s.nb}</b></div>

  }

  if (S.busy) estado = `<span class="estado idle"><span class="spin"></span> a inferir</span>`;
  else if (raw?.erro) estado = `<span class="estado erro">erro ${raw.status || ''}</span>`;
  else if (res && !resValido(res)) estado = `<span class="estado idle">desatualizado</span>`;
  else if (res) estado = `<span class="estado ${esc(res.resposta.estado)}">${esc(res.resposta.estado)}</span>`;
  else estado = `<span class="estado idle">em espera</span>`;
  const pend = res ? perguntasPend(res).length : 0;
  const pid = pos > 0 && res ? res.pedido.passos[pos - 1]?.id : null;
  const replay = S.tab === 'mapa' && res;
  el.innerHTML = `<span class="dot ${S.busy ? 'wait' : raw?.erro ? 'bad' : res ? 'ok' : ''}"></span>
    <b style="font-size:11px;color:${S.view === 'drools' ? 'var(--indigo)' : 'var(--cyan)'}">${esc(S.engine === 'both' ? 'prolog ⚖ drools' : S.view)}</b>
    ${replay ? `<div class="ctl">
        <button data-rp="first" title="Passo 0: só a base">⏮</button><button data-rp="prev" title="Passo anterior (←)">◀</button>
        <button class="play ${S.map.playing ? 'pause' : ''}" data-rp="play" title="Reproduzir a inferência passo a passo (espaço)">${S.map.playing ? '❚❚' : '▶'}</button>
        <button data-rp="next" title="Passo seguinte (→)">▶</button><button data-rp="last" title="Estado final">⏭</button></div>
      <div class="pos"><b>${pos === N ? 'Estado final' : 'Passo ' + pos + ' / ' + N}</b><span>${pos === 0 ? 'só a base de conhecimento' : pos === N ? N + ' passos inferidos' : esc(pid || '') + ' · ' + esc(trunc(S.byId.get(pid)?.descricao || 'resposta do analista', 30))}</span></div>
      <input type="range" id="rpRange" min="0" max="${N}" value="${pos}">
      <button class="spd" data-rp="spd" title="Velocidade">${S.map.speed}×</button>`
    : res ? `<span class="muted small">${res.pedido.passos.length} passos · ${res.ms} ms</span>` : `<button class="btn small" data-rerun="1" ${S.busy || !S.online ? 'disabled' : ''}>▶ Inferir</button>`}
    ${estado}
    ${res && S.engine === 'both' ? `<span class="seg">${readyEngines().map(m => `<button data-view="${m}" class="${S.view === m ? 'on' : ''}" style="padding:3px 8px">${m}</button>`).join('')}</span>` : ''}
    ${pend ? `<button class="qbadge" data-fila="1" title="Responder no inspetor">⚠ ${pend} pergunta${pend > 1 ? 's' : ''}</button>` : ''}
    <button class="icon-btn" data-rerun="1" title="Voltar a correr o motor" ${S.busy || !S.online ? 'disabled' : ''}>↻</button>`;
}
function renderFooter(extra) {
  const res = okRes(), M = res?.idx.map;
  $('footer').innerHTML = S.online
    ? `<span class="pill"><span class="dot ok"></span>API online · ${esc(S.base.replace(/^https?:\/\//, ''))}</span>
       <span>KB <b>v${esc(S.cat.versaoKB)}</b></span>
       ${M ? `<span><b>${M.ruleCount.size}</b> regras disparadas</span><span><b>${M.nodes.length}</b> nós</span><span><b>${M.edges.length}</b> ligações</span><span><b>${res.resposta.factos.length}</b> factos</span><span><b>${res.ms}</b> ms</span>` : ''}
       <span class="hgrow"></span><span>${esc(extra || '')}</span>`
    : `<span class="pill bad"><span class="dot bad"></span>API offline</span><span>${esc(extra || S.base)}</span>`;
}
function renderCenter() {
  const c = $('center');
  CUR = null;
  if (!S.online) {
    c.innerHTML = `<div class="empty"><div class="big">📡</div><h2>Sem ligação à API</h2>
      <div>O dashboard não tem dados próprios: o catálogo, as inferências e as explicações vêm do backend.<br>Confirme que o Spring Boot está a correr e indique o endereço.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><input class="inp" id="apiInput" value="${esc(S.base || defaultBase())}"><button class="btn" id="btnConnect">Ligar</button></div></div>`;
    return;
  }
  if (S.tab === 'comparar' && S.engine !== 'both') S.tab = 'mapa';
  const canvasTab = ['mapa', 'prova'].includes(S.tab);
  c.innerHTML = `<div class="notch${canvasTab ? '' : ' static'}" id="notch"></div>`;
  if (S.tab === 'api') renderApi(c);
  else if (S.tab === 'comparar') renderComparar(c);
  else {
    const raw = resAtual(), res = okRes();
    if (!res) c.insertAdjacentHTML('beforeend', raw?.erro
      ? `<div class="empty"><div class="errbox" style="max-width:560px;text-align:left"><b>${esc(S.view)} · HTTP ${raw.status || '—'} (${esc(HTTP_TXT[raw.status] || 'erro')})</b><br>${esc(raw.erro)}<div style="margin-top:10px"><button class="btn small" id="btnRetry">Tentar de novo</button></div></div></div>`
      : `<div class="empty"><div class="big">${S.busy ? '<span class="spin" style="width:30px;height:30px;border-width:3px"></span>' : '◈'}</div><h2>${S.busy ? 'A inferir…' : 'Motor em espera'}</h2><div>${S.busy ? 'O pedido foi enviado ao motor.' : 'Carregue em ▶ Inferir para enviar os passos ao motor.'}</div></div>`);
    else ({mapa: renderMapa, prova: renderProva, tickets: renderTickets, factos: renderFactos})[S.tab](c, res);
  }
  renderNotch();
}
function renderAll() { renderHeader(); renderViews(); renderCenter(); renderInsp(); renderFooter(); }

/* =====================================================================
   Eventos
   ===================================================================== */
function selecionar(sel) {
  S.sel = sel;
  S.filtro.passo = null; S.filtro.ambito = 'foco';
  S.insp.nav = [{t: 'fila'}];
  S.rootKey = null; S.map.pos = null; S.map.playing = false;
  if (S.tab === 'prova') S.tab = 'mapa';
  $('menu').classList.remove('open');
  const run = curRun();
  const need = S.engine === 'both' ? readyEngines() : [S.engine];
  const falta = need.filter(m => !resValido(run.res[m]));
  S.intro = true;
  renderAll();
  if (falta.length) correr(sel.tipo === 'completo' ? 'vista global' : 'cenário ' + sel.id, falta);
}
document.addEventListener('click', async e => {
  const menu = $('menu');
  if (menu.classList.contains('open') && !e.target.closest('#menu') && !e.target.closest('#scenBtn')) menu.classList.remove('open');
  const b = e.target.closest('button, [data-fact], input[type=checkbox]');
  if (!b || b.closest('.canvas')) return;
  if (b.closest('#eng') && b.dataset.eng) {
    if (b.dataset.eng === S.engine) return;
    lembrarSelecao();
    S.engine = b.dataset.eng;
    const run = curRun();
    S.view = S.engine === 'both' ? (run?.res[S.view] ? S.view : readyEngines()[0]) : S.engine;
    if (S.engine === 'both') S.tab = 'comparar';
    reconciliarSelecao();
    renderAll();
    const need = S.engine === 'both' ? readyEngines() : [S.engine];
    const falta = need.filter(m => !resValido(run?.res[m]));
    if (S.sel && run && falta.length) correr('troca de motor', falta);
    return;
  }
  if (b.id === 'scenBtn') { renderMenu(); menu.classList.toggle('open'); if (menu.classList.contains('open')) $('catSearch')?.focus(); return; }
  if (b.dataset.global) { selecionar({tipo: 'completo'}); return; }
  if (b.dataset.scen) { selecionar({tipo: 'cenario', id: b.dataset.scen}); return; }
  if (b.dataset.grp) {
    const g = b.dataset.grp, ordem = Object.keys(S.cat.sequencias || {});
    S.grupos = (b.checked ? [...new Set([...S.grupos, g])] : S.grupos.filter(x => x !== g)).sort((x, y) => ordem.indexOf(x) - ordem.indexOf(y));
    LS.set('grupos', S.grupos);
    renderMenu();
    return;
  }
  if (b.dataset.view) { lembrarSelecao(); S.view = b.dataset.view; reconciliarSelecao(); renderAll(); return; }
  if (b.dataset.tab || b.dataset.navTab) { S.tab = b.dataset.tab || b.dataset.navTab; S.map.playing = false; if (S.tab === 'mapa') S.intro = true; renderViews(); renderCenter(); return; }
  if (b.dataset.rerun || b.id === 'btnRetry') { correr('manual'); return; }
  if (b.dataset.rp) {
    const r = okRes(); if (!r) return;
    const N = r.idx.map.nPassos, pos = S.map.pos ?? N;
    if (b.dataset.rp === 'play') play();
    else if (b.dataset.rp === 'spd') { S.map.speed = {1: 2, 2: 4, 4: 0.5, 0.5: 1}[S.map.speed]; renderNotch(); }
    else { S.map.playing = false; stepTo({first: 0, prev: pos - 1, next: pos + 1, last: N}[b.dataset.rp], b.dataset.rp === 'next'); }
    return;
  }
  if (b.dataset.fila) { S.insp.nav = [{t: 'fila'}]; openInsp(true); renderInsp(); pinnedHighlight(); $('filaPerg')?.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (b.id === 'btnConnect') { connect($('apiInput').value); return; }
  if (b.id === 'btnApi') { const v = prompt('Endereço da API (Spring Boot):', S.base || defaultBase()); if (v) connect(v); return; }
  if (b.id === 'btnInsp') { openInsp(!S.insp.open); if (S.insp.open) renderInsp(); refit(); return; }
  if (b.id === 'inspClose') { openInsp(false); refit(); return; }
  if (b.id === 'inspWide') { setInspW(LS.get('insp-w', 430) > 520 ? 430 : 680); renderInsp(); refit(); return; }
  if (b.dataset.back) { if (b.dataset.back === 'all') S.insp.nav = [{t: 'fila'}]; else S.insp.nav.pop(); renderInsp(); pinnedHighlight(); return; }
  if (b.id === 'btnLog') { setLog(!$('app').classList.contains('log-open')); refit(); return; }
  if (b.id === 'logClear') { $('log').innerHTML = ''; return; }
  if (b.id === 'logCopy') { try { await navigator.clipboard.writeText($('log').innerText); toast('Consola copiada.', true); } catch { toast('O browser não deixou copiar.'); } return; }
  if (b.id === 'mBase') { S.map.showBase = b.checked; const r = okRes(); if (r) r.idx.map = buildMap(r.resposta, r.idx, r.pedido.passos.length); S.intro = true; renderCenter(); renderFooter(); return; }
  if (b.id === 'gHide') { G.hideInicial = b.checked; renderCenter(); return; }
  if (b.id === 'moreFacts') { S.filtro.lim = (S.filtro.lim || 400) + 400; renderCenter(); return; }
  if (b.dataset.setAmbito) { S.filtro.ambito = b.dataset.setAmbito; renderCenter(); return; }
  if (b.parentElement?.dataset.filtro) { S.filtro[b.parentElement.dataset.filtro] = b.dataset.v; S.filtro.lim = 0; renderCenter(); return; }
  if (b.dataset.q) { await responder(JSON.parse(b.dataset.q), JSON.parse(b.dataset.val)); return; }
  if (b.dataset.undo != null) { await desfazerResposta(+b.dataset.undo); return; }
  if (b.dataset.copy) {
    const x = curRun()?.res[b.dataset.m];
    try { await navigator.clipboard.writeText(JSON.stringify(b.dataset.copy === 'pedido' ? x.pedido : (x.resposta ?? x.corpoErro ?? null), null, 2)); toast('Copiado.', true); } catch { toast('O browser não deixou copiar.'); }
    return;
  }
  if (b.dataset.proof != null) { e.preventDefault(); openProof(+b.dataset.proof); return; }
  if (b.dataset.fact != null) { if (b.closest('summary')) e.preventDefault(); selectFact(+b.dataset.fact); }
});
document.addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-fact], .trow[data-fact]'); if (tr) openProof(+tr.dataset.fact); });
document.addEventListener('input', e => {
  if (e.target.id === 'catSearch') { S.filtro.cat = e.target.value; const pos = e.target.selectionStart; renderMenu(); const s = $('catSearch'); s.focus(); s.setSelectionRange(pos, pos); }
  if (e.target.id === 'fTexto') { S.filtro.texto = e.target.value; clearTimeout(S._ft); S._ft = setTimeout(() => { const pos = e.target.selectionStart; renderCenter(); const s = $('fTexto'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }, 220); }
  if (e.target.id === 'rpRange') { S.map.playing = false; stepTo(+e.target.value, false); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fPasso') { S.filtro.passo = e.target.value || null; renderCenter(); }
  if (e.target.id === 'gDepth') { G.depth = +e.target.value; renderCenter(); }
});
document.addEventListener('toggle', e => {
  const pre = e.target.querySelector?.(':scope > div > pre[data-lazy]');
  if (e.target.open && pre && !pre.textContent) { const x = curRun()?.res[pre.dataset.m]; pre.textContent = JSON.stringify(pre.dataset.lazy === 'pedido' ? x.pedido : (x.resposta ?? x.corpoErro ?? null), null, 2); }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'apiInput') connect(e.target.value);
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'Escape') { $('menu').classList.remove('open'); if (S.insp.nav.length > 1) { S.insp.nav.pop(); renderInsp(); pinnedHighlight(); } }
  if (S.tab !== 'mapa' || !okRes()) return;
  const N = okRes().idx.map.nPassos;
  if (e.key === ' ') { e.preventDefault(); play(); }
  if (e.key === 'ArrowRight') { S.map.playing = false; stepTo((S.map.pos ?? N) + 1, true); }
  if (e.key === 'ArrowLeft') { S.map.playing = false; stepTo((S.map.pos ?? N) - 1, false); }
});
/* inspetor redimensionavel */
function setInspW(w) { w = Math.max(340, Math.min(Math.round(window.innerWidth * 0.62), w)); document.documentElement.style.setProperty('--insp-w', w + 'px'); LS.set('insp-w', w); }
function refit() { if (!['mapa', 'prova'].includes(S.tab) || !okRes()) return; setTimeout(() => { for (const k in VIEW) delete VIEW[k]; renderCenter(); }, 40); }
(() => {
  const h = $('vresize');
  let d = null;
  h.addEventListener('pointerdown', e => { d = {x: e.clientX, w: $('insp').getBoundingClientRect().width}; h.classList.add('drag'); h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e => { if (d) setInspW(d.w + (d.x - e.clientX)); });
  h.addEventListener('pointerup', () => { if (d) { d = null; h.classList.remove('drag'); renderInsp(); refit(); } });
  h.addEventListener('dblclick', () => { setInspW(LS.get('insp-w', 430) > 520 ? 430 : 680); renderInsp(); refit(); });
})();
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(refit, 200); });

function setLog(open) { $('app').classList.toggle('log-open', open); $('btnLog').textContent = open ? '▼ Consola de eventos' : '▲ Consola de eventos'; LS.set('log-open', open); }
$('favicon').href = $('logo').src;
setLog(LS.get('log-open', false));
setInspW(LS.get('insp-w', 430));
openInsp(LS.get('insp-open', true));
renderAll();
connect();
</script>
</body>
</html>
