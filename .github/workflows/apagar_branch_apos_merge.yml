# Apaga automaticamente a branch feature depois de um PR ser aceite (merged).
# A develop e a main nunca sao apagadas.
# Quem fizer um PR fica com a branch limpa no repositorio remoto.
name: Apagar branch apos merge

on:
  pull_request:
    types: [closed]

jobs:
  apagar-branch:
    # So corre se o PR foi de facto aceite E a branch nao for develop nem main
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Apagar branch remota apos merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/' + branch
              });
              console.log(`Branch "${branch}" apagada com sucesso.`);
            } catch (err) {
              // Se ja nao existir, nao e erro
              if (err.status === 422) {
                console.log(`Branch "${branch}" ja nao existe.`);
              } else {
                throw err;
              }
            }
