# Testes do backend (issues #11 e #12): PrologProperties, PrologAdapter (com o swipl real e wrappers falsos),
# PrologInstaller, DroolsAdapter e o arranque do Spring. Precisa do JDK 25 e do SWI-Prolog.
# Localmente: ./mvnw -pl backend/socrates -am verify
name: Backend

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Modulo backend/socrates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Instalar o SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      - name: Testes do backend
        run: ./mvnw -B -pl backend/socrates -am verify

      - name: Relatorios dos testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-backend
          path: backend/socrates/target/surefire-reports/