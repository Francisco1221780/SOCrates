# Logger do modulo Drools quando corre sozinho (consola no IntelliJ, exec:java): so os erros, para a consola e o JSON
# da resposta ficarem limpos (o Drools escreve avisos de desempenho dos eval ao compilar as regras).
# Nos testes o Surefire passa o nivel para info (pom.xml). O backend nao le este ficheiro: usa o logger do Spring Boot.
org.slf4j.simpleLogger.defaultLogLevel=error
